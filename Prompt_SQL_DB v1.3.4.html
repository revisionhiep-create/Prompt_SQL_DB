<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt SQL DB (Universal Edition v1.3.4) - AI Prompt Manager</title>
    <style>
        /* Modern CSS Variables with Glassmorphism Support */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #151520;
            --bg-tertiary: #1e1e2e;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --bg-glass-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #707080;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-light: rgba(99, 102, 241, 0.2);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --blur: blur(20px);
            --scale: 1.0;
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f3f5;
            --bg-glass: rgba(0, 0, 0, 0.03);
            --bg-glass-hover: rgba(0, 0, 0, 0.06);
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a5a;
            --text-muted: #8a8a9a;
            --border-color: rgba(0, 0, 0, 0.1);
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --accent-light: rgba(79, 70, 229, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: var(--bg-glass-hover);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }
        
        .header h1 .brand-main {
            color: var(--text-primary);
        }
        
        .header h1 .brand-accent {
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .save-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .save-indicator.saved {
            color: var(--success);
        }

        .save-indicator.unsaved {
            color: var(--warning);
        }

        .save-indicator span:first-child {
            font-size: 16px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            background: var(--accent);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-glass-hover);
        }

        .btn-icon {
            padding: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        /* Main Container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Side Drawer for Categories */
        .category-drawer {
            position: fixed;
            left: 0;
            top: 0;
            width: 320px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 500;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 20px;
        }

        .category-drawer.open {
            transform: translateX(0);
        }

        .drawer-toggle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: var(--accent);
            border: none;
            border-radius: 0 12px 12px 0;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 400;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawer-toggle:hover {
            background: var(--accent-hover);
            transform: translateY(-50%) translateX(4px);
        }

        .drawer-toggle.open {
            left: 320px;
        }

        /* Header Groups */
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            justify-content: center;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-group {
            display: flex;
            background: var(--bg-glass);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        /* Filter Chips */
        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            min-height: 32px;
        }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: var(--accent-light);
            border: 1px solid var(--accent);
            border-radius: 16px;
            font-size: 12px;
            color: var(--accent-hover);
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-chip:hover {
            background: var(--accent);
            color: white;
        }

        .filter-chip .remove {
            font-size: 14px;
            font-weight: bold;
            opacity: 0.7;
        }

        /* Status Dot */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-dot.saved { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.unsaved { background: var(--warning); box-shadow: 0 0 8px var(--warning); }

        /* Bulk Action Bar */
        .bulk-action-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--shadow-lg);
            z-index: 1500;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
        }

        .bulk-action-bar.active {
            transform: translateX(-50%) translateY(0);
        }

        .bulk-count {
            font-weight: 700;
            color: var(--accent);
            padding-right: 20px;
            border-right: 1px solid var(--border-color);
        }

        /* Card Hover Copy */
        .card-copy-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            opacity: 0;
            z-index: 10;
        }

        .image-card:hover .card-copy-btn {
            opacity: 1;
        }

        .card-copy-btn:hover {
            background: var(--success);
            transform: scale(1.1);
        }

        /* Selection Overlay */
        .image-card.selected {
            border: 3px solid var(--accent);
            transform: scale(0.95);
        }

        .selection-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            z-index: 20;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .image-card.selected .selection-indicator {
            display: flex;
        }

        /* Clickable Tags in Detail */
        .clickable-meta {
            cursor: pointer;
            transition: color 0.2s;
        }

        .clickable-meta:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .drawer-close {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .drawer-close:hover {
            background: var(--error);
            color: white;
        }

        .drawer-clear {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
            margin-right: 8px;
        }

        .drawer-clear:hover {
            background: var(--warning);
            color: white;
            transform: scale(1.05);
        }

        .drawer-clear:active {
            transform: scale(0.95);
        }

        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 450;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }

        .main-content {
            transition: margin-left 0.3s ease;
        }

        .main-content.drawer-open {
            margin-left: 0;
        }

        /* Tag Filter Bar - Now in drawer */
        .tag-filter-bar {
            padding: 0;
        }

        .tag-category-group {
            margin-bottom: 16px;
        }

        .tag-category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--text-primary);
            user-select: none;
        }

        .tag-category-header:hover {
            background: var(--bg-glass-hover);
            border-color: var(--accent);
        }

        .tag-category-header.has-selected {
            background: rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
            color: #93c5fd;
        }

        .tag-category-icon {
            font-size: 18px;
            transition: transform 0.2s;
        }

        .tag-category-header.collapsed .tag-category-icon {
            transform: rotate(-90deg);
        }

        .tag-category-expand {
            margin-left: auto;
            font-size: 12px;
            opacity: 0.6;
        }

        .tag-category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-left: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease, padding-top 0.3s ease;
        }

        .tag-category-group.expanded .tag-category-tags {
            max-height: 500px;
            padding-top: 12px;
        }

        .tag-filter {
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .tag-filter:hover {
            background: var(--bg-glass-hover);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .tag-filter.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .category-manage-btn {
            margin-left: auto;
            padding: 4px 8px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        /* Image Grid */
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .images-grid.list-view {
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .image-card {
            position: relative;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
        }

        .image-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* List View Styles */
        .image-card.list-row {
            display: grid;
            grid-template-columns: calc(110px * var(--scale, 1)) 1fr 150px 150px 120px 80px 80px 120px 120px;
            gap: 12px;
            align-items: center;
            padding: calc(12px * var(--scale, 1)) 16px;
            aspect-ratio: unset;
            height: auto;
            min-height: calc(110px * var(--scale, 1));
        }

        .image-card.list-row img {
            width: calc(110px * var(--scale, 1));
            height: calc(110px * var(--scale, 1));
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .image-card.list-row .list-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .image-card.list-row .filename {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-card.list-row .list-cell {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            padding-right: 8px;
        }

        .list-header {
            display: grid;
            grid-template-columns: calc(110px * var(--scale, 1)) 1fr 150px 150px 120px 80px 80px 120px 120px;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            align-items: center;
        }

        .list-header > div {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .list-header > div:hover {
            color: var(--accent);
        }

        .list-header > div.active-sort {
            color: var(--accent);
            text-decoration: underline;
        }

        .list-header > div:first-child { text-align: center; cursor: default; }
        .list-header > div:first-child:hover { color: var(--text-secondary); }

        /* Scale Control */
        .scale-control {
            display: flex;
            background: var(--bg-glass);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            gap: 4px;
            margin-left: 8px;
        }

        .scale-btn {
            padding: 4px 8px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .scale-btn:hover { background: var(--bg-glass-hover); color: var(--text-primary); }
        .scale-btn.active { background: var(--accent); color: white; }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .image-card:hover .image-overlay {
            transform: translateY(0);
        }

        .image-tag {
            padding: 4px 10px;
            background: var(--accent-light);
            border: 1px solid var(--accent);
            border-radius: 12px;
            font-size: 11px;
            color: var(--accent-hover);
            margin-right: 4px;
            margin-top: 4px;
            display: inline-block;
        }

        .image-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-card:hover .image-actions {
            opacity: 1;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        /* Tag Selection UI */
        .tag-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-block {
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .category-block:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .category-title.has-selected {

    <!-- sql.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

    <script>
        // Global state
        let SQL = null;
        let db = null;
        let currentImageId = null;
        let selectedTags = new Set();
        let activeFilters = new Set();
        let allTags = new Set();
        let hasUnsavedChanges = false;
        let currentFolderId = null;
        let currentImageList = [];
        let currentImageIndex = -1;
        let categoryDrawerOpen = false;
        let viewMode = localStorage.getItem('promptdb-view-mode') || 'grid';
        let imageObjectURLs = new Map();
        let selectedIds = new Set();
        let lastSelectedId = null;
        
        // Sorting and Resizing state
        let sortColumn = localStorage.getItem('promptdb-sort-col') || 'created_at';
        let sortOrder = localStorage.getItem('promptdb-sort-order') || 'DESC';
        let listScale = parseFloat(localStorage.getItem('promptdb-list-scale')) || 1.0;
        
        let isAddingImage = false;
        let addImageFormHTML = null;
        let isEditingCategory = false;
        let savedFileInput = null;
        let savedPositivePrompt = '';
        let savedNegativePrompt = '';

        // Tag categories (Comprehensive list from ChromeEdge edition)
        const TAG_CATEGORIES = {
            'Art Style': { icon: '🎨', tags: ['Impressionism', 'Surrealism', 'Abstract', 'Realism', 'Cubism', 'Pop Art', 'Minimalism', 'Cyberpunk', 'Steampunk', 'Anime', 'Digital Painting', 'Watercolor', 'Oil Painting', '3D Render', 'Pixel Art', 'Concept Art'] },
            'Camera': { icon: '📷', tags: ['Close-Up', 'Wide Shot', 'Medium Shot', 'Bird\'s Eye View', 'Low Angle', 'High Angle', 'Eye-Level', 'Dutch Angle', 'Panoramic', 'Macro', 'Bokeh', 'Shallow Depth of Field'] },
            'Lighting': { icon: '💡', tags: ['Golden Hour', 'Blue Hour', 'Natural Light', 'Studio Lighting', 'Backlighting', 'Rim Light', 'Soft Light', 'Hard Light', 'Dramatic Shadows', 'High Key', 'Low Key', 'Candlelight', 'Neon Lights'] },
            'Theme': { icon: '🌍', tags: ['Fantasy', 'Sci-Fi', 'Urban', 'Nature', 'Portrait', 'Landscape', 'Abstract', 'Futuristic', 'Medieval', 'Vintage', 'Modern', 'Minimalist', 'Maximalist'] },
            'Mood': { icon: '😊', tags: ['Serene', 'Dramatic', 'Mysterious', 'Joyful', 'Melancholic', 'Energetic', 'Peaceful', 'Tense', 'Romantic', 'Nostalgic', 'Eerie', 'Vibrant'] },
            'Color': { icon: '🌈', tags: ['Warm Tones', 'Cool Tones', 'Monochromatic', 'Vibrant', 'Muted', 'Pastel', 'High Contrast', 'Low Contrast', 'Sepia', 'Black & White'] }
        };

        // Initialize sql.js
        async function initSQL() {
            if (!SQL) {
                const config = { locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}` };
                SQL = await initSqlJs(config);
            }
            return SQL;
        }

        // Helper to add column if missing
        const addColumnIfMissing = (tableName, colName, colType) => {
            try {
                const tableInfo = db.exec(`PRAGMA table_info(${tableName});`);
                if (tableInfo.length === 0) return false;
                const columns = tableInfo[0].values.map(col => col[1]);
                if (!columns.includes(colName)) {
                    // Note: SQLite ALTER TABLE does NOT allow non-constant defaults like CURRENT_TIMESTAMP
                    // So we add the column without a default and update values manually
                    db.run(`ALTER TABLE ${tableName} ADD COLUMN ${colName} ${colType};`);
                    console.log(`Migration: Added column ${colName} to ${tableName}`);
                    return true;
                }
            } catch (e) {
                console.error(`Migration error adding column ${colName} to ${tableName}:`, e.message);
            }
            return false;
        };

        // Database migrations
        function runMigrations() {
            if (!db) return;
            try {
                console.log('Running database migrations...');
                
                // Add missing columns to images table
                addColumnIfMissing('images', 'folder_id', 'INTEGER');
                addColumnIfMissing('images', 'updated_at', 'DATETIME');
                addColumnIfMissing('images', 'positive_prompt', 'TEXT');
                addColumnIfMissing('images', 'negative_prompt', 'TEXT');
                addColumnIfMissing('images', 'model', 'TEXT');
                addColumnIfMissing('images', 'seed', 'TEXT');
                addColumnIfMissing('images', 'steps', 'TEXT');
                addColumnIfMissing('images', 'cfg', 'TEXT');
                addColumnIfMissing('images', 'sampler', 'TEXT');
                addColumnIfMissing('images', 'size', 'TEXT');
                addColumnIfMissing('images', 'metadata_text', 'TEXT');

                // Initialize updated_at if missing values
                try {
                    db.run(`UPDATE images SET updated_at = created_at WHERE updated_at IS NULL;`);
                    db.run(`UPDATE images SET updated_at = CURRENT_TIMESTAMP WHERE updated_at IS NULL;`);
                } catch (e) {
                    console.warn('Migration: Could not initialize updated_at data:', e.message);
                }
                
                // Ensure image_tags table exists
                db.run(`CREATE TABLE IF NOT EXISTS image_tags (id INTEGER PRIMARY KEY AUTOINCREMENT, image_id INTEGER NOT NULL, tag_name TEXT NOT NULL, category TEXT, FOREIGN KEY (image_id) REFERENCES images(id) ON DELETE CASCADE);`);
                
                // Check image_tags columns
                addColumnIfMissing('image_tags', 'category', 'TEXT');

                // Ensure custom_categories table exists
                db.run(`CREATE TABLE IF NOT EXISTS custom_categories (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL UNIQUE, icon TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);`);
                
                // Ensure indices exist
                try { db.run(`CREATE INDEX IF NOT EXISTS idx_images_updated ON images(updated_at);`); } catch(e) {}
                try { db.run(`CREATE INDEX IF NOT EXISTS idx_images_created ON images(created_at);`); } catch(e) {}
                try { db.run(`CREATE INDEX IF NOT EXISTS idx_images_folder ON images(folder_id);`); } catch(e) {}
                
                console.log('Database migrations verified');
            } catch (e) {
                console.error('Migration critical error:', e);
            }
        }

        // Initialize database
        async function initializeDatabase() {
            try {
                await initSQL();
                db = new SQL.Database();
                
                // Skeleton tables - runMigrations will add all other columns
                db.run(`CREATE TABLE IF NOT EXISTS folders (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL UNIQUE, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);`);
                db.run(`CREATE TABLE IF NOT EXISTS images (id INTEGER PRIMARY KEY AUTOINCREMENT, filename TEXT NOT NULL, image_data BLOB NOT NULL, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);`);
                db.run(`CREATE TABLE IF NOT EXISTS image_tags (id INTEGER PRIMARY KEY AUTOINCREMENT, image_id INTEGER NOT NULL, tag_name TEXT NOT NULL, category TEXT, FOREIGN KEY (image_id) REFERENCES images(id) ON DELETE CASCADE);`);
                db.run(`CREATE TABLE IF NOT EXISTS custom_tags (id INTEGER PRIMARY KEY AUTOINCREMENT, category TEXT NOT NULL, tag_name TEXT NOT NULL, UNIQUE(category, tag_name));`);
                db.run(`CREATE TABLE IF NOT EXISTS custom_categories (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL UNIQUE, icon TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);`);
                
                runMigrations();

                showToast('Database initialized!', 'success');
                markSaved();
                loadFolders();
                loadImages();
            } catch (error) {
                console.error('Error initializing database:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }

        // --- Full Metadata Extraction ---
        const LR = /<lora:([^:>]+)(?::([^:>]+))?(?::([^:>]+))?>/g;

        async function decompressZlib(data) {
            try {
                const ds = new DecompressionStream('deflate-raw');
                const writer = ds.writable.getWriter();
                writer.write(data.slice(2, data.length - 4));
                writer.close();
                return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
            } catch (e) {
                try {
                    const ds = new DecompressionStream('deflate');
                    const writer = ds.writable.getWriter();
                    writer.write(data);
                    writer.close();
                    return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
                } catch(e2) { return null; }
            }
        }

        function cleanTextForParsing(text) {
            if (!text) return "";
            return text.replace(/\0/g, '').replace(/[\x00-\x08\x0B-\x0C\x0E-\x1F]/g, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        }

        function extractEXIFUserComment(exifData) {
            try {
                const dataView = new DataView(exifData.buffer || exifData);
                let offset = 0;
                while (offset < exifData.length - 12) {
                    const tag = dataView.getUint16(offset, true);
                    if (tag === 37510) {
                        const count = dataView.getUint32(offset + 4, true);
                        const valueOffset = dataView.getUint32(offset + 8, true);
                        if (count > 0 && valueOffset < exifData.length) {
                            const valueData = new Uint8Array(exifData, valueOffset, Math.min(count, exifData.length - valueOffset));
                            if (valueData.length > 8) {
                                const encoding = String.fromCharCode(...valueData.slice(0, 8)).replace(/\0/g, '');
                                if (encoding.includes('UNICODE') || encoding.includes('Unicode')) {
                                    const textData = valueData.slice(8);
                                    try {
                                        const dLE = new TextDecoder('utf-16le').decode(textData);
                                        if (dLE && (dLE.includes('Steps:') || dLE.includes('Negative prompt:'))) return dLE;
                                    } catch(e) {}
                                    try {
                                        const dBE = new TextDecoder('utf-16be').decode(textData);
                                        if (dBE && (dBE.includes('Steps:') || dBE.includes('Negative prompt:'))) return dBE;
                                    } catch(e) {}
                                    return new TextDecoder('utf-16le').decode(textData);
                                }
                                return new TextDecoder('utf-8').decode(valueData.slice(8));
                            }
                            return new TextDecoder('utf-8').decode(valueData);
                        }
                    }
                    offset += 12;
                }
            } catch(e) {}
            return null;
        }

        function extractEXIFUserCommentFromJPEG(buffer) {
            try {
                const view = new DataView(buffer);
                let offset = 2;
                while (offset < buffer.byteLength - 4) {
                    if (view.getUint8(offset) === 0xFF && view.getUint8(offset + 1) === 0xE1) {
                        const segmentLength = view.getUint16(offset + 2);
                        const segmentData = new Uint8Array(buffer, offset + 4, segmentLength - 2);
                        if (segmentLength > 6 && String.fromCharCode(...segmentData.slice(0, 6)) === 'Exif\0\0') {
                            const userComment = extractEXIFUserComment(segmentData.slice(6));
                            if (userComment) return userComment;
                        }
                        offset += segmentLength + 2;
                    } else { offset++; }
                }
                const bufferArray = new Uint8Array(buffer);
                const unicodeMarker = new TextEncoder().encode('UNICODE');
                for (let i = 0; i < bufferArray.length - 108; i++) {
                    let match = true;
                    for (let j = 0; j < 7; j++) if (bufferArray[i+j] !== unicodeMarker[j]) { match = false; break; }
                    if (match) {
                        const textData = bufferArray.slice(i + 8);
                        try {
                            const dLE = new TextDecoder('utf-16le').decode(textData);
                            if (dLE.includes('Steps:') || dLE.includes('Negative prompt:')) return dLE;
                            const dBE = new TextDecoder('utf-16be').decode(textData);
                            if (dBE.includes('Steps:') || dBE.includes('Negative prompt:')) return dBE;
                        } catch(e) {}
                    }
                }
            } catch(e) {}
            return null;
        }

        async function extractText(buffer) {
            const view = new DataView(buffer);
            let fullText = "";
            try {
                if (view.getUint32(0) === 0x89504E47) {
                    let offset = 8;
                    while (offset < view.byteLength) {
                        const len = view.getUint32(offset);
                        const type = String.fromCharCode(...new Uint8Array(buffer, offset + 4, 4));
                        if (type === 'tEXt' || type === 'iTXt') fullText += new TextDecoder('utf-8').decode(new Uint8Array(buffer, offset + 8, len)).replace(/\0/g, '') + "\n";
                        else if (type === 'zTXt') {
                            const inflated = await decompressZlib(new Uint8Array(buffer, offset + 8, len));
                            if (inflated) fullText += inflated + "\n";
                        }
                        offset += len + 12;
                        if (type === 'IEND') break;
                    }
                } else if (view.getUint32(0) === 0x52494646 || view.getUint16(0) === 0xFFD8) {
                    const exifText = extractEXIFUserCommentFromJPEG(buffer);
                    if (exifText) fullText = exifText;
                    else {
                        try { fullText = new TextDecoder('utf-8').decode(new Uint8Array(buffer)); } catch(e) {}
                    }
                }
            } catch(e) {}
            return cleanTextForParsing(fullText);
        }

        function extractJSON(str, startPos = 0) {
            const start = str.indexOf('{', startPos);
            if (start === -1) return null;
            let count = 0, end = -1;
            for (let i = start; i < str.length; i++) {
                if (str[i] === '{') count++; else if (str[i] === '}') count--;
                if (count === 0) { end = i; break; }
            }
            if (end !== -1) {
                try { return {json: JSON.parse(str.substring(start, end + 1)), end: end + 1}; } catch(e) { return null; }
            }
            return null;
        }

        function parseComfy(json) {
            let pos = "", neg = "", meta = {model: "?", size: "?", seed: "?", steps: "?", cfg: "?", sampler: "?"}, resources = [];
            let nodes = [];
            let nodeMap = {};
            
            if (json.nodes && Array.isArray(json.nodes)) {
                nodes = json.nodes.map(n => {
                    const node = {
                        class_type: n.type || n.data?.class_type || "",
                        inputs: n.inputs || n.data?.inputs || (n.widgets_values ? {} : {})
                    };
                    if (n.id !== undefined) nodeMap[n.id] = node;
                    return node;
                }).filter(n => n.class_type || n.inputs);
            } else {
                const vals = Object.values(json);
                nodes = vals.filter(n => n && typeof n === 'object' && (n.class_type || n.inputs));
                vals.forEach((n, i) => {
                    if (n && typeof n === 'object' && (n.class_type || n.inputs)) {
                        const key = Object.keys(json)[i];
                        if (key && !isNaN(key)) nodeMap[key] = n;
                    }
                });
            }

            const findUpstreamText = (l, d = 0) => {
                if (d > 10 || !l || !Array.isArray(l)) return "";
                let n = null;
                if (typeof l[0] === 'string' || typeof l[0] === 'number') {
                    n = json[l[0]] || nodeMap[l[0]];
                } else if (typeof l[0] === 'object') {
                    n = l[0];
                }
                if (!n) return "";
                const inputs = n.inputs || {};
                if (!inputs && !n.widgets_values) return "";
                let t = "";
                
                if (Array.isArray(n.widgets_values) && n.widgets_values.length > 0 && typeof n.widgets_values[0] === 'string') {
                    t += n.widgets_values[0];
                }
                if (typeof inputs.text === 'string') {
                    t += (t ? ", " : "") + inputs.text;
                } else if (Array.isArray(inputs.text)) {
                    const r = findUpstreamText(inputs.text, d + 1);
                    if (r) t += (t ? ", " : "") + r;
                }
                if (typeof inputs.text_g === 'string') t += (t ? ", " : "") + inputs.text_g;
                if (typeof inputs.text_l === 'string') t += (t ? ", " : "") + inputs.text_l;
                if (inputs.string_field) t += (t ? ", " : "") + inputs.string_field;
                
                for (const key in inputs) {
                    if (key.startsWith('string_') || key.startsWith('str_') || key.includes('text') || key.includes('prompt')) {
                        const val = inputs[key];
                        if (typeof val === 'string' && val.length > 0) {
                            if (key !== 'delimiter' || val.length > 1) t += (t ? "" : "") + val;
                        } else if (Array.isArray(val) && val.length > 0) {
                            const r = findUpstreamText(val, d + 1);
                            if (r) t += (t ? ", " : "") + r;
                        }
                    }
                }
                
                if (inputs.trigger_words_display && Array.isArray(inputs.trigger_words_display.__value__)) {
                    const tags = inputs.trigger_words_display.__value__.filter(x => x.active).map(x => x.text).join(", ");
                    if (tags) t += (t ? ", " : "") + tags;
                }
                
                const keys = ['positive', 'negative', 'conditioning', 'clip', 'prompt', 'trigger_words'];
                for (const k of keys) {
                    if (inputs[k]) {
                        const r = findUpstreamText(inputs[k], d + 1);
                        if (r) t += (t ? ", " : "") + r;
                    }
                }
                
                if (!t) {
                    for (const key in inputs) {
                        const val = inputs[key];
                        if (Array.isArray(val) && val.length > 0 && (typeof val[0] === 'string' || typeof val[0] === 'number')) {
                            const r = findUpstreamText(val, d + 1);
                            if (r) { t = r; break; }
                        }
                    }
                }
                return t;
            };

            const findUpstreamModel = (l, d = 0) => {
                if (d > 10 || !l || !Array.isArray(l)) return "";
                let n = null;
                if (typeof l[0] === 'string' || typeof l[0] === 'number') {
                    n = json[l[0]] || nodeMap[l[0]];
                } else if (typeof l[0] === 'object') {
                    n = l[0];
                }
                if (!n) return "";
                const inputs = n.inputs || {};
                if (inputs.ckpt_name) return inputs.ckpt_name;
                if (inputs.unet_name) return inputs.unet_name;
                if (inputs.checkpoint_name) return inputs.checkpoint_name;
                if (inputs.model_name) return inputs.model_name;
                if (inputs.model) return findUpstreamModel(inputs.model, d + 1);
                return "";
            };

            const samplerTypes = ["KSampler", "KSamplerAdvanced", "SamplerCustom", "SamplerEulerAncestralCFGPP", "SamplerLCM"];
            const ksampler = nodes.find(n => n.class_type && samplerTypes.some(type => n.class_type.includes(type)));
            
            if (ksampler) {
                const inputs = ksampler.inputs || {};
                meta.seed = inputs.seed || inputs.noise_seed || "?";
                meta.steps = inputs.steps || "?";
                meta.cfg = inputs.cfg || "?";
                meta.sampler = inputs.sampler_name || ksampler.class_type || "?";
                if (inputs.scheduler) meta.sampler += " " + inputs.scheduler;
                if (inputs.positive) pos = findUpstreamText(inputs.positive);
                if (inputs.negative) neg = findUpstreamText(inputs.negative);
                if (inputs.model) meta.model = findUpstreamModel(inputs.model).replace(/\.(safetensors|ckpt)$/, "");
            }

            nodes.forEach(n => {
                const nodeType = n.class_type || "";
                const inputs = n.inputs || {};
                if (inputs.lora_name) resources.push({type: 'LoRA', name: inputs.lora_name.replace(/\.(safetensors|ckpt)$/, ""), str: inputs.strength_model});
                if (nodeType.includes("Power Lora Loader")) {
                    for (const [k, v] of Object.entries(inputs)) {
                        if (k.startsWith('lora_') && v?.on) {
                            resources.push({type: 'LoRA', name: v.lora.replace(/\.(safetensors|ckpt)$/, ""), str: v.strength});
                        }
                    }
                }
                if (inputs.loras && Array.isArray(inputs.loras.__value__)) {
                    inputs.loras.__value__.forEach(l => {
                        if (l.name && l.active !== false) {
                            resources.push({type: 'LoRA', name: l.name, str: l.strength});
                        }
                    });
                }
                if (nodeType.includes("ControlNet") && inputs.control_net_name) {
                    resources.push({type: 'ControlNet', name: inputs.control_net_name, str: inputs.strength || "1.0"});
                }
                if (nodeType.includes("IPAdapter") && inputs.ipadapter_file) {
                    resources.push({type: 'IP-Adapter', name: inputs.ipadapter_file, str: inputs.weight || "1.0"});
                }
            });

            const sizeNodes = ["EmptyLatentImage", "LatentUpscale", "LatentComposite", "EmptySD3LatentImage"];
            const sizeNode = nodes.find(n => sizeNodes.includes(n.class_type));
            if (sizeNode) {
                const inputs = sizeNode.inputs || {};
                if (inputs.width && inputs.height) meta.size = `${inputs.width}x${inputs.height}`;
            }
            
            return {pos, neg, meta, resources};
        }

        function parseA1111(text) {
            let pos = "", neg = "";
            let resources = [];
            let meta = { model: "?", size: "?", seed: "?", steps: "?", cfg: "?", sampler: "?" };

            // Clean text - remove any remaining control characters
            text = text.replace(/[\x00-\x08\x0B-\x0C\x0E-\x1F]/g, '');

            let match;
            LR.lastIndex = 0;
            while ((match = LR.exec(text)) !== null) {
                resources.push({type: 'LoRA', name: match[1], str: match[2] || "1.0"});
            }

            // Extract Civitai resources JSON (common in Flux/Civitai exports)
            const civitaiResourcesMatch = text.match(/Civitai resources:\s*(\[.*?\])/);
            if (civitaiResourcesMatch) {
                try {
                    const resJson = JSON.parse(civitaiResourcesMatch[1]);
                    resJson.forEach(res => {
                        let name = res.modelName || res.name || "Unknown";
                        if (res.modelVersionName && res.modelVersionName !== "v1.0") name += ` (${res.modelVersionName})`;
                        resources.push({
                            type: res.type || 'Unknown',
                            name: name,
                            str: String(res.weight || '1.0')
                        });
                    });
                } catch(e) {}
            }

            // Try multiple marker variations (case-insensitive)
            const negMarkers = ["Negative prompt:", "Negative Prompt:", "negative prompt:", "Negative prompt"];
            const stepsMarkers = ["Steps:", "Steps", "Step:"];
            
            let negIdx = -1, stepsIdx = -1;
            let negMarker = "";
            
            // Find negative prompt marker
            for (const marker of negMarkers) {
                const idx = text.indexOf(marker);
                if (idx !== -1) {
                    negIdx = idx;
                    negMarker = marker;
                    break;
                }
            }
            
            // Find steps marker
            for (const marker of stepsMarkers) {
                const idx = text.indexOf(marker);
                if (idx !== -1) {
                    stepsIdx = idx;
                    break;
                }
            }

            // Extract prompts
            if (negIdx !== -1 && stepsIdx !== -1 && negIdx < stepsIdx) {
                pos = text.substring(0, negIdx).replace(/parameters\s*/i, "").trim();
                neg = text.substring(negIdx + negMarker.length, stepsIdx).trim();
            } else if (stepsIdx !== -1) {
                pos = text.substring(0, stepsIdx).replace(/parameters\s*/i, "").trim();
            } else if (negIdx !== -1) {
                // Only negative marker found
                pos = text.substring(0, negIdx).replace(/parameters\s*/i, "").trim();
                neg = text.substring(negIdx + negMarker.length).trim();
            } else {
                // No markers found - try to extract from JSON or use whole text
                if(text.includes('"widgets_values"')) {
                    const parts = text.split(/"text":\s*"/);
                    if(parts.length > 1) pos = parts[1].split('"')[0];
                } else {
                    // Check if it's just a prompt without metadata markers
                    pos = text.trim();
                }
            }

            // Extract parameters - improved regex patterns
            if (stepsIdx !== -1) {
                const block = text.substring(stepsIdx);
                
                // More flexible parameter extraction
                const getParam = (key, patterns) => {
                    for (const pattern of patterns) {
                        const regex = new RegExp(pattern, 'i');
                        const match = block.match(regex);
                        if (match && match[1]) {
                            return match[1].trim();
                        }
                    }
                    return "?";
                };
                
                meta.steps = getParam("Steps", [
                    "Steps:\\s*([0-9]+)",
                    "Steps\\s*:\\s*([0-9]+)",
                    "Steps\\s+([0-9]+)"
                ]);
                
                meta.sampler = getParam("Sampler", [
                    "Sampler:\\s*([^,\\n]+)",
                    "Sampler\\s*:\\s*([^,\\n]+)",
                    "Sampler\\s+([^,\\n]+)"
                ]);
                
                meta.cfg = getParam("CFG", [
                    "CFG\\s+scale:\\s*([0-9.]+)",
                    "CFG\\s*scale\\s*:\\s*([0-9.]+)",
                    "CFG\\s*:\\s*([0-9.]+)",
                    "CFG scale\\s*:\\s*([0-9.]+)"
                ]);
                
                meta.seed = getParam("Seed", [
                    "Seed:\\s*([0-9]+)",
                    "Seed\\s*:\\s*([0-9]+)",
                    "Seed\\s+([0-9]+)"
                ]);
                
                meta.size = getParam("Size", [
                    "Size:\\s*([0-9xX]+)",
                    "Size\\s*:\\s*([0-9xX]+)",
                    "Size\\s+([0-9xX]+)"
                ]);
                
                meta.model = getParam("Model", [
                    "Model:\\s*([^,\\n]+)",
                    "Model\\s*:\\s*([^,\\n]+)",
                    "Model\\s+([^,\\n]+)"
                ]);
            }

            return {pos, neg, resources, meta};
        }

        function parseMetadata(text) {
            let comfyResult = null;
            if (text.includes('"class_type"') && text.includes('"inputs"')) {
                let pos = 0;
                while (true) {
                    const result = extractJSON(text, pos);
                    if (!result) break;
                    const json = result.json;
                    pos = result.end;
                    if (json && (json.class_type || json.nodes || Object.values(json).some(v => v && typeof v === 'object' && (v.class_type || v.type)))) {
                        const parsed = parseComfy(json);
                        if (parsed && (parsed.pos || parsed.meta.model !== "?")) {
                            comfyResult = parsed;
                            break;
                        }
                    }
                }
            }
            if (!comfyResult && (text.includes('"class_type"') || text.includes('"type"') || (text.includes('"inputs"') && (text.includes('KSampler') || text.includes('CLIPTextEncode') || text.includes('SaveImage') || text.includes('CLIPLoader') || text.includes('VAELoader'))))) {
                let pos = 0;
                while (true) {
                    const result = extractJSON(text, pos);
                    if (!result) break;
                    const json = result.json;
                    pos = result.end;
                    if (json && (json.class_type || json.nodes || json.type || Object.values(json).some(v => v && typeof v === 'object' && (v.class_type || v.type)))) {
                        const parsed = parseComfy(json);
                        if (parsed && (parsed.pos || parsed.meta.model !== "?")) {
                            comfyResult = parsed;
                            break;
                        }
                    }
                }
            }
            if (comfyResult) return comfyResult;
            return parseA1111(text);
        }

        function suggestTagsFromMetadata(parsed) {
            const suggestedTags = [];
            const promptLower = (parsed.pos || '').toLowerCase();
            
            // Get all tags from database and default categories
            const allCategoryTags = {};
            Object.entries(TAG_CATEGORIES).forEach(([category, data]) => {
                allCategoryTags[category] = [...data.tags];
            });
            
            // Load custom tags from database
            if (db) {
                try {
                    const customTags = db.exec(`SELECT category, tag_name FROM custom_tags;`);
                    if (customTags.length > 0 && customTags[0].values.length > 0) {
                        customTags[0].values.forEach(row => {
                            const [category, tagName] = row;
                            if (allCategoryTags[category] && !allCategoryTags[category].includes(tagName)) {
                                allCategoryTags[category].push(tagName);
                            }
                        });
                    }
                } catch (e) {
                    console.warn('Error loading custom tags:', e);
                }
            }
            
            // Match tags from prompt
            Object.entries(allCategoryTags).forEach(([category, tags]) => {
                tags.forEach(tag => {
                    if (promptLower.includes(tag.toLowerCase())) {
                        suggestedTags.push({category, tag});
                    }
                });
            });
            
            return suggestedTags;
        }

        // --- Database & Files ---
        async function exportDatabase() {
            if (!db) return showToast('No database to export', 'error');
            try {
                const blob = new Blob([db.export()], { type: 'application/x-sqlite3' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = 'PromptDB.sqlite'; a.click();
                URL.revokeObjectURL(url);
                markSaved();
                showToast('Database exported!', 'success');
            } catch (e) { showToast('Export failed: ' + e.message, 'error'); }
        }

        function showImportModal() { document.getElementById('fileInput').click(); }

        async function handleFileInput(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.name.endsWith('.sqlite') || file.name.endsWith('.db')) {
                try {
                    await initSQL();
                    const buf = await file.arrayBuffer();
                    db = new SQL.Database(new Uint8Array(buf));
                    
                    // Run migrations
                    runMigrations();
                    
                    showToast('Database loaded!', 'success');
                    markSaved(); loadFolders(); loadImages();
                } catch (e) { showToast('Import failed: ' + e.message, 'error'); }
            } else {
                showAddImageModal();
                setTimeout(() => {
                    const input = document.querySelector('#modalBody input[type="file"]');
                    if (input) {
                        const dt = new DataTransfer(); dt.items.add(file);
                        input.files = dt.files; 
                        previewImageFile(input);
                    }
                }, 100);
            }
            event.target.value = '';
        }

        // --- Gallery Rendering ---
        function loadImages() {
            if (!db) return;
            const grid = document.getElementById('imagesGrid');
            if (!grid) return;
            
            let searchQuery = document.getElementById('searchInput')?.value.toLowerCase() || '';
            let q = `SELECT i.*, GROUP_CONCAT(it.tag_name) as tags FROM images i LEFT JOIN image_tags it ON i.id = it.image_id WHERE 1=1`;
            let params = [];

            // Advanced "Smart" Search Support
            const filters = {
                model: searchQuery.match(/model:([^\s]+)/)?.[1],
                size: searchQuery.match(/size:([^\s]+)/)?.[1],
                steps: searchQuery.match(/steps:([^\s]+)/)?.[1],
                cfg: searchQuery.match(/cfg:([^\s]+)/)?.[1],
                seed: searchQuery.match(/seed:([^\s]+)/)?.[1],
                sampler: searchQuery.match(/sampler:([^\s]+)/)?.[1]
            };

            Object.keys(filters).forEach(k => { if (filters[k]) searchQuery = searchQuery.replace(new RegExp(`${k}:[^\s]+`, 'g'), ''); });
            
            if (filters.model) { q += ` AND i.model LIKE ?`; params.push(`%${filters.model}%`); }
            if (filters.size) { q += ` AND i.size LIKE ?`; params.push(`%${filters.size}%`); }
            if (filters.steps) { q += ` AND i.steps = ?`; params.push(filters.steps); }
            if (filters.cfg) { q += ` AND i.cfg = ?`; params.push(filters.cfg); }
            if (filters.seed) { q += ` AND i.seed = ?`; params.push(filters.seed); }
            if (filters.sampler) { q += ` AND i.sampler LIKE ?`; params.push(`%${filters.sampler}%`); }

            if (currentFolderId) { q += ` AND i.folder_id = ?`; params.push(currentFolderId); }
            
            const textSearch = searchQuery.trim();
            if (textSearch) { 
                q += ` AND (i.filename LIKE ? OR i.positive_prompt LIKE ? OR it.tag_name LIKE ?)`; 
                params.push(`%${textSearch}%`, `%${textSearch}%`, `%${textSearch}%`); 
            }

            if (activeFilters.size > 0) { 
                q += ` AND it.tag_name IN (${Array.from(activeFilters).map(() => '?').join(',')})`; 
                params.push(...Array.from(activeFilters)); 
            }

            // Safety check for sort column existence
            let finalSortColumn = sortColumn;
            try {
                db.exec(`SELECT ${sortColumn} FROM images LIMIT 1;`);
            } catch (e) {
                console.warn(`Sort column ${sortColumn} not found, falling back to created_at`);
                finalSortColumn = 'created_at';
            }

            q += ` GROUP BY i.id ORDER BY i.${finalSortColumn} ${sortOrder}`;

            const res = db.exec(q, params);
            grid.innerHTML = ''; 
            currentImageList = [];
            
            // Memory management: Revoke old URLs
            imageObjectURLs.forEach(url => URL.revokeObjectURL(url)); 
            imageObjectURLs.clear();

            if (!res.length || !res[0].values.length) {
                grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1; text-align: center; padding: 100px;"><div style="font-size: 80px; opacity: 0.5;">🔍</div><h2>No images found</h2><p>Try broadening your search or clear filters.</p></div>';
                return;
            }

            if (viewMode === 'list') {
                const header = document.createElement('div');
                header.className = 'list-header';
                header.style.setProperty('--scale', listScale);
                const headers = [
                    { label: 'Image', col: null },
                    { label: 'Filename', col: 'filename' },
                    { label: 'Model', col: 'model' },
                    { label: 'Sampler', col: 'sampler' },
                    { label: 'Size', col: 'size' },
                    { label: 'Steps', col: 'steps' },
                    { label: 'CFG', col: 'cfg' },
                    { label: 'Created', col: 'created_at' },
                    { label: 'Modified', col: 'updated_at' }
                ];
                
                header.innerHTML = headers.map(h => {
                    const activeClass = sortColumn === h.col ? 'active-sort' : '';
                    const arrow = sortColumn === h.col ? (sortOrder === 'ASC' ? ' ↑' : ' ↓') : '';
                    if (!h.col) return `<div>${h.label}</div>`;
                    return `<div class="${activeClass}" onclick="toggleSort('${h.col}')">${h.label}${arrow}</div>`;
                }).join('');
                grid.appendChild(header);
                grid.classList.add('list-view');
            } else {
                grid.classList.remove('list-view');
            }

            res[0].values.forEach(row => {
                const img = {}; res[0].columns.forEach((c, i) => img[c] = row[i]);
                currentImageList.push(img.id);
                
                const blob = new Blob([img.image_data], { type: 'image/png' });
                const url = URL.createObjectURL(blob); 
                imageObjectURLs.set(img.id, url);
                
                const tags = img.tags ? img.tags.split(',') : [];
                const card = document.createElement('div');
                card.className = `image-card ${viewMode === 'list' ? 'list-row' : ''} ${selectedIds.has(img.id) ? 'selected' : ''}`;
                card.setAttribute('data-id', img.id);
                if (viewMode === 'list') card.style.setProperty('--scale', listScale);
                
                if (viewMode === 'list') {
                    card.innerHTML = `
                        <div class="selection-indicator">✓</div>
                        <img src="${url}" loading="lazy">
                        <div class="list-info">
                            <div class="filename">${img.filename}</div>
                            <div class="list-meta">
                                ${tags.length > 0 ? tags.slice(0, 3).map(tag => `<span class="image-tag">${tag}</span>`).join('') : ''}
                                ${tags.length > 3 ? `<span class="image-tag">+${tags.length - 3}</span>` : ''}
                            </div>
                        </div>
                        <div class="list-cell">${img.model || '?'}</div>
                        <div class="list-cell">${img.sampler || '?'}</div>
                        <div class="list-cell">${img.size || '?'}</div>
                        <div class="list-cell">${img.steps || '?'}</div>
                        <div class="list-cell">${img.cfg || '?'}</div>
                        <div class="list-cell">${new Date(img.created_at).toLocaleDateString()}</div>
                        <div class="list-cell">${new Date(img.updated_at || img.created_at).toLocaleDateString()}</div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="selection-indicator">✓</div>
                        <button class="card-copy-btn" onclick="copyPromptToClipboard(${img.id}, event)" title="Copy Prompt">📋</button>

        // --- Selection Logic ---
        function toggleSelection(id, e) {
            if (e.shiftKey && lastSelectedId !== null) {
                const start = currentImageList.indexOf(lastSelectedId), end = currentImageList.indexOf(id);
                if (start !== -1 && end !== -1) {
                    const range = currentImageList.slice(Math.min(start, end), Math.max(start, end) + 1);
                    const shouldSelect = !selectedIds.has(id);
                    range.forEach(rid => shouldSelect ? selectedIds.add(rid) : selectedIds.delete(rid));
                }
            } else { 
                if (selectedIds.has(id)) selectedIds.delete(id); 
                else selectedIds.add(id); 
            }
            lastSelectedId = id; 
            updateSelectionUI();
        }

        function updateSelectionUI() {
            document.querySelectorAll('.image-card').forEach(c => {
                const id = parseInt(c.getAttribute('data-id'));
                if (selectedIds.has(id)) c.classList.add('selected'); 
                else c.classList.remove('selected');
            });
            const bar = document.getElementById('bulkActionBar'), count = document.getElementById('bulkCount');
            if (selectedIds.size > 0) { 
                bar.classList.add('active'); 
                count.textContent = `${selectedIds.size} selected`; 
            } else {
                bar.classList.remove('active');
            }
        }

        function clearSelection() { selectedIds.clear(); updateSelectionUI(); }

        async function previewImageFile(input) {
            const f = input.files[0]; if (!f) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const imgPreview = document.getElementById('imagePreview');
                imgPreview.src = e.target.result;
                imgPreview.style.display = 'block';
                const buf = await f.arrayBuffer();
                const raw = await extractText(buf);
                const p = parseMetadata(raw);
                document.getElementById('positivePrompt').value = p.pos || '';
                document.getElementById('negativePrompt').value = p.neg || '';
                
                // Smart auto-tagging
                const suggested = suggestTagsFromMetadata(p);
                selectedTags.clear(); 
                suggested.forEach(s => selectedTags.add(s.tag));
                renderTagCategories();
            };
            reader.readAsDataURL(f);
        }

        async function saveImage(e) {
            e.preventDefault();
            const fd = new FormData(e.target), file = fd.get('imageFile');
            if (!file || !file.size) return showToast('Please select an image', 'error');
            
            const buf = await file.arrayBuffer();
            const raw = await extractText(buf);
            const p = parseMetadata(raw);
            const pos = fd.get('positivePrompt') || p.pos || '';
            const neg = fd.get('negativePrompt') || p.neg || '';
            
            try {
                db.run(`INSERT INTO images (filename, image_data, positive_prompt, negative_prompt, model, seed, steps, cfg, sampler, size, metadata_text, folder_id, created_at, updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)`,
                    [file.name, new Uint8Array(buf), pos, neg, p.meta.model, p.meta.seed, p.meta.steps, p.meta.cfg, p.meta.sampler, p.meta.size, raw, currentFolderId]);
                
                const res = db.exec("SELECT last_insert_rowid()");
                const id = res[0].values[0][0];
                
                selectedTags.forEach(t => {
                    db.run("INSERT INTO image_tags (image_id, tag_name, category) VALUES (?,?,?)", [id, t, 'Other']);
                });
                
                showToast('Image saved successfully!', 'success'); 
                markUnsaved(); 
                closeModal(); 
                loadImages();
            } catch (err) {
                showToast('Save failed: ' + err.message, 'error');

        async function handleBatchFileInput(event) {
            const files = Array.from(event.target.files).filter(f => f.type.startsWith('image/'));
            if (files.length === 0) return;

            document.getElementById('batchProgressContainer').style.display = 'block';
            const bar = document.getElementById('batchProgressBar');
            const text = document.getElementById('batchProgressText');
            
            let successCount = 0;
            let errorCount = 0;

            db.run('BEGIN TRANSACTION');
            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const progress = Math.round(((i + 1) / files.length) * 100);
                    bar.style.width = progress + '%';
                    text.textContent = `Processing image ${i + 1} of ${files.length}...`;
                    
                    // Allow UI to refresh
                    if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));

                    try {
                        const buf = await file.arrayBuffer();
                        const raw = await extractText(buf);
                        const p = parseMetadata(raw);
                        
                        db.run(`INSERT INTO images (filename, image_data, positive_prompt, negative_prompt, model, seed, steps, cfg, sampler, size, metadata_text, folder_id, created_at, updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP)`,
                            [file.name, new Uint8Array(buf), p.pos || '', p.neg || '', p.meta.model, p.meta.seed, p.meta.steps, p.meta.cfg, p.meta.sampler, p.meta.size, raw, currentFolderId]);
                        
                        const idRes = db.exec("SELECT last_insert_rowid()");
                        const id = idRes[0].values[0][0];
                        
                        // Auto-tagging
                        const suggested = suggestTagsFromMetadata(p);
                        suggested.forEach(s => {
                            db.run("INSERT INTO image_tags (image_id, tag_name, category) VALUES (?,?,?)", [id, s.tag, s.category || 'Other']);
                        });
                        
                        successCount++;
                    } catch (e) {
                        console.error('Error processing', file.name, e);
                        errorCount++;
                    }
                }
                db.run('COMMIT');
                showToast(`Batch Import Complete! Added: ${successCount}, Failed: ${errorCount}`, successCount > 0 ? 'success' : 'error');
                markUnsaved();
                closeModal();
                loadImages();
            } catch (err) {
                db.run('ROLLBACK');
                showToast('Batch Import Failed: ' + err.message, 'error');
            }
            event.target.value = ''; // Reset input
        }

        // Edit detail field (toggle edit mode)

                fields.forEach(f => {
                    const view = document.getElementById(`${f}_view_${imageId}`);

            } else {
                const view = document.getElementById(`${fieldName}_view_${imageId}`);

                if (view) view.style.display = 'none';
                if (edit) edit.style.display = 'block';

                    const model = document.getElementById(`model_input_${imageId}`).value;
                    const sampler = document.getElementById(`sampler_input_${imageId}`).value;
                    const seed = document.getElementById(`seed_input_${imageId}`).value;

                    const cfg = document.getElementById(`cfg_input_${imageId}`).value;
                    const size = document.getElementById(`size_input_${imageId}`).value;

                    db.run(`UPDATE images SET model=?, sampler=?, seed=?, steps=?, cfg=?, size=?, updated_at=CURRENT_TIMESTAMP WHERE id=?`,

                } else {
                    const value = document.getElementById(`${fieldName}_input_${imageId}`).value;
                    db.run(`UPDATE images SET ${fieldName}=?, updated_at=CURRENT_TIMESTAMP WHERE id=?`, [value, imageId]);

                showImageDetail(imageId);

            listScale = scale;

            document.documentElement.style.setProperty('--scale', scale);
            const btns = document.querySelectorAll('.scale-btn');
            btns.forEach(btn => {
                const btnScale = parseFloat(btn.textContent) / 100;
                btn.classList.toggle('active', Math.abs(btnScale - scale) < 0.01);
