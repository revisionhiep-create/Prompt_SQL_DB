        // --- Categories & Tags ---
        function getAllCategories() {
            const categories = { ...TAG_CATEGORIES };
            if (!categories['Other']) categories['Other'] = { icon: '📦', tags: [] };
            if (db) try {
                const res = db.exec(`SELECT name, icon FROM custom_categories ORDER BY name;`);
                if (res.length) res[0].values.forEach(r => { if (!categories[r[0]]) categories[r[0]] = { icon: r[1] || '📁', tags: [] }; });
            } catch (e) {}
            return categories;
        }

        function getCategoryTags(cat) {
            const tags = [...(TAG_CATEGORIES[cat]?.tags || [])];
            if (db) try {
                const res = db.exec(`SELECT tag_name FROM custom_tags WHERE category = ?;`, [cat]);
                if (res.length) res[0].values.forEach(r => { if (!tags.includes(r[0])) tags.push(r[0]); });
            } catch (e) {}
            return tags;
        }

        function renderTagCategories() {
            const container = document.getElementById('tagCategoriesContainer');
            if (!container) return; 
            container.innerHTML = '';
            const cats = getAllCategories();
            Object.entries(cats).forEach(([cat, data]) => {
                const tags = getCategoryTags(cat);
                const hasSelected = tags.some(t => selectedTags.has(t));
                const block = document.createElement('div');
                block.className = 'category-block';
                block.onclick = (e) => {
                    if (e.target.classList.contains('category-tag')) return;
                    // Logic to show category manager or similar if needed
                };
                block.innerHTML = `
                    <div class="category-title ${hasSelected ? 'has-selected' : ''}">
                        <span>${data.icon || '📁'} ${cat}</span>
                    </div>
                    <div class="category-tags">
                        ${tags.sort().map(t => `<span class="category-tag ${selectedTags.has(t) ? 'selected' : ''}" onclick="toggleTag('${t.replace(/'/g, "\\'")}')">${t}</span>`).join('')}
                        <button type="button" class="category-tag" style="background:transparent; border:1px dashed var(--border-color); color:var(--text-muted);" onclick="addCustomTagPrompt('${cat}')">+</button>
                    </div>
                `;
                container.appendChild(block);
            });
        }

        function addCustomTagPrompt(cat) {
            const tag = prompt(`Add new tag to ${cat}:`);
            if (tag) {
                try {
                    db.run("INSERT INTO custom_tags (category, tag_name) VALUES (?,?)", [cat, tag]);
                    selectedTags.add(tag);
                    markUnsaved();
                    renderTagCategories();
                } catch(e) { showToast('Tag already exists', 'error'); }
            }
        }

        function toggleTag(tag) { 
            if (selectedTags.has(tag)) selectedTags.delete(tag); 
            else selectedTags.add(tag); 
            renderTagCategories(); 
        }

        function toggleFilter(tag) {
            if (activeFilters.has(tag)) activeFilters.delete(tag);
            else activeFilters.add(tag);
            loadImages();
        }

        function updateTagFilterBar() {
            const bar = document.getElementById('tagFilterBar'); if (!bar || !db) return;
            bar.innerHTML = '';
            const cats = getAllCategories();
            const tagCounts = {}; try {
                const res = db.exec("SELECT tag_name, COUNT(*) FROM image_tags GROUP BY tag_name");
                if (res.length) res[0].values.forEach(r => tagCounts[r[0]] = r[1]);
            } catch(e) {}

            Object.entries(cats).forEach(([cat, data]) => {
                const tags = getCategoryTags(cat).filter(t => tagCounts[t]);
                if (tags.length === 0) return;
                const group = document.createElement('div'); group.className = 'tag-category-group';
                const header = document.createElement('div'); header.className = 'tag-category-header collapsed';
                if (tags.some(t => activeFilters.has(t))) header.classList.add('has-selected');
                header.innerHTML = `<span class="tag-category-icon">▼</span><span>${data.icon} ${cat}</span><span class="tag-category-expand">(${tags.length})</span>`;
                const tCont = document.createElement('div'); tCont.className = 'tag-category-tags';
                tags.sort().forEach(t => {
                    const btn = document.createElement('div'); btn.className = `tag-filter ${activeFilters.has(t) ? 'active' : ''}`;
                    btn.innerHTML = `<span>${t}</span> <small style="opacity:0.6">${tagCounts[t]}</small>`;
                    btn.onclick = (e) => { e.stopPropagation(); if (activeFilters.has(t)) activeFilters.delete(t); else activeFilters.add(t); loadImages(); };
                    tCont.appendChild(btn);
                });
                header.onclick = () => { header.classList.toggle('collapsed'); group.classList.toggle('expanded'); };
                group.appendChild(header); group.appendChild(tCont); bar.appendChild(group);
            });
        }

        function updateFilterChips() {
            const c = document.getElementById('filterChips'); if(!c) return; c.innerHTML = '';
            activeFilters.forEach(t => {
                const chip = document.createElement('div'); chip.className = 'filter-chip';
                chip.innerHTML = `<span>${t}</span><span class="remove" onclick="activeFilters.delete('${t.replace(/'/g, "\\'")}'); loadImages();">×</span>`;
                c.appendChild(chip);
            });
        }

        // --- Folders & Bulk ---
        function loadFolders() {
            const s = document.getElementById('folderSelect'); if (!s || !db) return;
            const res = db.exec("SELECT id, name FROM folders ORDER BY name");
            s.innerHTML = '<option value="">All Folders</option>';
            if (res.length) res[0].values.forEach(r => s.innerHTML += `<option value="${r[0]}">${r[1]}</option>`);
        }

        function handleFolderChange() { currentFolderId = document.getElementById('folderSelect').value || null; loadImages(); }

        function showAddCategoryModal() {
            showModal('Create Tag Category', `
                <div class="form-group"><label class="form-label">Category Name</label><input type="text" class="form-input" id="newCatName" required placeholder="e.g., Environment, Characters"></div>
                <div class="form-group"><label class="form-label">Icon (Emoji)</label><input type="text" class="form-input" id="newCatIcon" value="📁"></div>
                <div class="form-actions"><button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="addNewCategory()">Create Category</button></div>
            `);
        }

        function addNewCategory() {
            const name = document.getElementById('newCatName').value.trim(), icon = document.getElementById('newCatIcon').value.trim();
            if (!name) return;
            try { 
                db.run("INSERT INTO custom_categories (name, icon) VALUES (?,?)", [name, icon]); 
                showToast('Category created!'); 
                markUnsaved(); 
                closeModal(); 
                updateTagFilterBar(); 
            } catch(e) { showToast('Category already exists or error occurred', 'error'); }
        }

        function showFolderManager() {
            if (!db) return;
            const res = db.exec("SELECT id, name FROM folders ORDER BY name");
            const folders = res.length ? res[0].values : [];
            const html = `
                <div class="form-group">
                    <label class="form-label">Existing Folders</label>
                    <div style="max-height: 250px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 10px; padding: 10px;">
                        ${folders.length ? folders.map(f => `
                            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--bg-tertiary); border-radius:8px; margin-bottom:8px; border:1px solid var(--border-color);">
                                <span style="font-weight:600;">📁 ${f[1]}</span>
                                <button class="btn btn-secondary" style="color:var(--error); padding:4px 10px; font-size:12px;" onclick="deleteFolder(${f[0]})">Delete</button>
                            </div>
                        `).join('') : '<p style="text-align:center; color:var(--text-muted); padding:20px;">No folders created yet.</p>'}
                    </div>
                </div>
                <div class="form-group" style="margin-top:20px;">
                    <label class="form-label">Create New Folder</label>
                    <div style="display:flex; gap:10px;">
                        <input type="text" class="form-input" id="newFolderName" placeholder="Folder name...">
                        <button class="btn" onclick="createFolder()">Create</button>
                    </div>
                </div>
                <div class="form-actions"><button class="btn btn-secondary" onclick="closeModal()">Close</button></div>
            `;
            showModal('Manage Folders', html);
        }

        function createFolder() {
            const n = document.getElementById('newFolderName').value.trim(); if (!n) return;
            try { db.run("INSERT INTO folders (name) VALUES (?)", [n]); showToast('Folder created!'); markUnsaved(); showFolderManager(); loadFolders(); } catch(e) { showToast('Folder name exists', 'error'); }
        }

        function deleteFolder(id) { 
            if(!confirm('Are you sure? Images in this folder will be unassigned but not deleted.')) return; 
            try { 
                db.run("DELETE FROM folders WHERE id=?", [id]); 
                showToast('Folder deleted'); 
                markUnsaved(); 
                showFolderManager(); 
                loadFolders(); 
                if (currentFolderId == id) { currentFolderId = null; loadImages(); }
            } catch(e) { showToast('Error deleting folder', 'error'); } 
        }

        function bulkDelete() { 
            if(!confirm(`Permanently delete ${selectedIds.size} images? This cannot be undone.`)) return; 
            try { 
                db.run('BEGIN TRANSACTION'); 
                for(let id of selectedIds) db.run("DELETE FROM images WHERE id=?", [id]); 
                db.run('COMMIT'); 
                selectedIds.clear(); 
                markUnsaved(); 
                loadImages(); 
                updateSelectionUI(); 
                showToast('Bulk deletion complete');
            } catch(e) { 
                db.run('ROLLBACK'); 
                showToast('Bulk delete failed', 'error');
            } 
        }

        function bulkMove() {
            if (!db) return;
            const res = db.exec("SELECT id, name FROM folders ORDER BY name");
            const folders = res.length ? res[0].values : [];
            const html = `
                <div class="form-group">
                    <label class="form-label">Select Destination Folder for ${selectedIds.size} items</label>
                    <select id="bulkMoveFolder" class="form-input">
                        <option value="">(No Folder / Root)</option>
                        ${folders.map(f => `<option value="${f[0]}">${f[1]}</option>`).join('')}
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn" onclick="executeBulkMove()">Move Images</button>
                </div>
            `;
            showModal('Bulk Move', html);
        }

        function executeBulkMove() {
            const folderId = document.getElementById('bulkMoveFolder').value || null;
            try {
                db.run('BEGIN TRANSACTION');
                for (let id of selectedIds) db.run("UPDATE images SET folder_id = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?", [folderId, id]);
                db.run('COMMIT');
                showToast('Images moved successfully!');
                markUnsaved();
                clearSelection();
                closeModal();
                loadImages();
            } catch(e) { db.run('ROLLBACK'); showToast('Move failed', 'error'); }
        }

        function showMoveImageModal(imageId) {
            if (!db) return;
            const res = db.exec("SELECT folder_id FROM images WHERE id = ?", [imageId]);
            const currentFid = res.length ? res[0].values[0][0] : null;
            const resF = db.exec("SELECT id, name FROM folders ORDER BY name");
            const folders = resF.length ? resF[0].values : [];
            
            const html = `
                <div class="form-group">
                    <label class="form-label">Select Destination Folder</label>
                    <select id="moveImageFolder" class="form-input">
                        <option value="">(No Folder / Root)</option>
                        ${folders.map(f => `<option value="${f[0]}" ${currentFid == f[0] ? 'selected' : ''}>${f[1]}</option>`).join('')}
                    </select>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn" onclick="moveImageToFolder(${imageId})">Move Image</button>
                </div>
            `;
            showModal('Move Image to Folder', html);
        }

        function moveImageToFolder(imageId) {
            const folderId = document.getElementById('moveImageFolder').value || null;
            try {
                db.run("UPDATE images SET folder_id = ?, updated_at = CURRENT_TIMESTAMP WHERE id = ?", [folderId, imageId]);
                showToast('Image moved successfully!');
                markUnsaved();
                closeModal();
                loadImages();
            } catch(e) { showToast('Move failed', 'error'); }
        }

        function bulkTag() {
            isAddingImage = false; // Reuse tag rendering logic
            const html = `
                <div class="form-group">
                    <label class="form-label">Add Tags to ${selectedIds.size} selected images</label>
                    <p style="font-size:12px; color:var(--text-muted); margin-bottom:15px;">Selected tags will be added to all chosen images. Existing tags are preserved.</p>
                    <div class="tag-categories" id="tagCategoriesContainer"></div>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn" onclick="executeBulkTag()">Apply Tags</button>
                </div>
            `;
            showModal('Bulk Tagging', html);
            renderTagCategories();
        }

        function executeBulkTag() {
            try {
                db.run('BEGIN TRANSACTION');
                for (let id of selectedIds) {
                    selectedTags.forEach(tag => {
                        try { db.run("INSERT INTO image_tags (image_id, tag_name, category) VALUES (?,?,?)", [id, tag, 'Other']); } catch(e) {}
                    });
                }
                db.run('COMMIT');
                showToast('Tags applied to all selected images!');
                markUnsaved();
                clearSelection();
                closeModal();
                loadImages();
            } catch(e) { db.run('ROLLBACK'); showToast('Tagging failed', 'error'); }
        }

        // --- Helpers ---
        function escapeHtml(t) { 
            if (!t) return "";
            const d = document.createElement('div'); d.textContent = t; return d.innerHTML; 
        }

        function escapeHtmlAttr(str) {
            if (!str) return "";
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function copyToClipboard(text, label = 'Text') {
            if (!text || text === 'None' || text === '?') return;
            navigator.clipboard.writeText(text).then(() => {
                showToast(`${label} copied to clipboard!`, 'success');
            }).catch(err => {
                console.error('Could not copy text: ', err);
                showToast('Failed to copy to clipboard', 'error');
            });
        }

        function copyTextToClipboard(text) {
            if (!text || text === 'None' || text === '?') return;
            navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard!', 'success'));
        }

        function copyPromptToClipboard(id, e) { 
            if(e) e.stopPropagation(); 
            const res = db.exec("SELECT positive_prompt FROM images WHERE id=?", [id]); 
            if(res.length && res[0].values.length) { 
                copyToClipboard(res[0].values[0][0], 'Positive prompt'); 
            } else {
                showToast('No prompt to copy', 'warning');
            }
        }

        function copyNegativePromptToClipboard(id, e) {
            if(e) e.stopPropagation();
            const res = db.exec("SELECT negative_prompt FROM images WHERE id=?", [id]);
            if(res.length && res[0].values.length) {
                copyToClipboard(res[0].values[0][0], 'Negative prompt');
            } else {
                showToast('No negative prompt to copy', 'warning');
            }
        }

        function copyModelToClipboard(id, e) {
            if(e) e.stopPropagation();
            const res = db.exec("SELECT model FROM images WHERE id=?", [id]);
            if(res.length && res[0].values.length) {
                copyToClipboard(res[0].values[0][0], 'Model');
            }
        }

        function copySeedToClipboard(id, e) {
            if(e) e.stopPropagation();
            const res = db.exec("SELECT seed FROM images WHERE id=?", [id]);
            if(res.length && res[0].values.length) {
                copyToClipboard(res[0].values[0][0], 'Seed');
            }
        }

        function copyAllMetadata(id) {
            const res = db.exec("SELECT metadata_text FROM images WHERE id=?", [id]);
            if (res.length && res[0].values[0][0]) {
                navigator.clipboard.writeText(res[0].values[0][0]);
                showToast('Full metadata copied!');
            }
        }

        function deleteImage(id, e) { 
            if(e) e.stopPropagation(); 
            if(!confirm('Permanently delete this image?')) return; 
            try {
                db.run("DELETE FROM images WHERE id=?", [id]); 
                showToast('Image deleted'); 
                markUnsaved(); 
                loadImages(); 
                if (document.getElementById('detailView').classList.contains('active')) closeDetailView();
            } catch(e) { showToast('Delete failed', 'error'); }
        }

        function clearAllTagFilters() { 
            if (activeFilters.size === 0) return;
            activeFilters.clear(); 
            loadImages(); 
            showToast('All filters cleared');
        }

        window.addEventListener('DOMContentLoaded', () => {
            const theme = localStorage.getItem('promptcraft-theme') || 'dark';
            document.body.setAttribute('data-theme', theme);
            
            // Initialize scale
            updateListScale(listScale);
            
            setupKeyboardShortcuts();
            
            // Background click listeners
            document.getElementById('detailView').addEventListener('click', closeDetailView);
            document.getElementById('modal').addEventListener('click', (e) => { if(e.target.id === 'modal') closeModal(); });
            
            updateSaveIndicator();
            
            // Check if there's a saved view mode in local storage
            const savedView = localStorage.getItem('promptdb-view-mode');
            if (savedView) {
                viewMode = savedView;
                document.getElementById('viewToggleBtn').innerHTML = viewMode === 'grid' ? '🖼️' : '📋';
                
                // Show scale control if in list view
                if (viewMode === 'list') {
                    const grid = document.getElementById('imagesGrid');
                    if (grid) grid.classList.add('list-view');
                    const scaleControl = document.getElementById('listScaleControl');
                    if (scaleControl) scaleControl.style.display = 'flex';
                }
            }
        });

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                if (e.key === 'Escape') { 
                    if (categoryDrawerOpen) toggleCategoryDrawer(); 
                    else if (document.getElementById('detailView').classList.contains('active')) closeDetailView();
                    else closeModal(); 
                }
                if (e.key === '/') { e.preventDefault(); document.getElementById('searchInput').focus(); }
                if (e.key.toLowerCase() === 'v') toggleViewMode();
                if (e.key.toLowerCase() === 't') toggleTheme();
                if (e.key.toLowerCase() === 'b') toggleCategoryDrawer();
                
                if (e.ctrlKey && e.key.toLowerCase() === 'o') { e.preventDefault(); showImportModal(); }
                if (e.ctrlKey && e.key.toLowerCase() === 'e') { e.preventDefault(); exportDatabase(); }
                
                // Navigation in detail view
                if (document.getElementById('detailView').classList.contains('active')) {
                    if (e.key === 'ArrowRight') {
                        if (currentImageIndex < currentImageList.length - 1) showImageDetail(currentImageList[currentImageIndex + 1]);
                    }
                    if (e.key === 'ArrowLeft') {
                        if (currentImageIndex > 0) showImageDetail(currentImageList[currentImageIndex - 1]);
                    }
                }
            });
        }

        function showHelpModal() {
            showModal('Help & Shortcuts', `
                <div style="line-height:1.8;">
                    <h3 style="color:var(--accent); margin-bottom:10px;">⌨️ Keyboard Shortcuts</h3>
                    <ul style="list-style:none; padding:0;">
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">V</kbd> Toggle Grid/List View</li>
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">T</kbd> Toggle Dark/Light Mode</li>
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">B</kbd> Toggle Category Sidebar</li>
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">/</kbd> Focus Search Bar</li>
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">Esc</kbd> Close Modals / Back</li>
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">Ctrl+O</kbd> Import Database</li>
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">Ctrl+E</kbd> Export Database</li>
                        <li><kbd style="background:var(--bg-tertiary); padding:2px 6px; border-radius:4px; border:1px solid var(--border-color);">Shift+Click</kbd> Select Range</li>
                    </ul>
                    <h3 style="color:var(--accent); margin-top:20px; margin-bottom:10px;">🔍 Smart Search</h3>
                    <p style="font-size:14px;">Use prefixes for precise searching:</p>
                    <code style="display:block; background:var(--bg-tertiary); padding:10px; border-radius:8px; font-size:13px; margin-top:5px;">model:sdxl size:1024x1024 steps:30 cfg:7</code>
                    <h3 style="color:var(--accent); margin-top:20px; margin-bottom:10px;">💾 Storage Note</h3>
                    <p style="font-size:14px; color:var(--warning);">This Universal Edition runs entirely in browser memory. <strong>Always export your database</strong> to save your changes permanently to disk.</p>
                </div>
            `);
        }
    
    </script>
</body>
</html>
