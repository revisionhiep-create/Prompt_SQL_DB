<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt SQL DB - AI Prompt Manager</title>
    <style>
        /* Modern CSS Variables with Glassmorphism Support */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #151520;
            --bg-tertiary: #1e1e2e;
            --bg-glass: rgba(255, 255, 255, 0.05);
            --bg-glass-hover: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #707080;
            --border-color: rgba(255, 255, 255, 0.1);
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-light: rgba(99, 102, 241, 0.2);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --blur: blur(20px);
        }

        [data-theme="light"] {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f3f5;
            --bg-glass: rgba(0, 0, 0, 0.03);
            --bg-glass-hover: rgba(0, 0, 0, 0.06);
            --text-primary: #1a1a1a;
            --text-secondary: #4a4a5a;
            --text-muted: #8a8a9a;
            --border-color: rgba(0, 0, 0, 0.1);
            --accent: #4f46e5;
            --accent-hover: #6366f1;
            --accent-light: rgba(79, 70, 229, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: var(--bg-glass-hover);
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
        }
        
        .header h1 .brand-main {
            color: var(--text-primary);
        }
        
        .header h1 .brand-accent {
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        .save-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--bg-glass);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .save-indicator.saved {
            color: var(--success);
        }

        .save-indicator.unsaved {
            color: var(--warning);
        }

        .save-indicator span:first-child {
            font-size: 16px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            background: var(--accent);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-glass-hover);
        }

        .btn-icon {
            padding: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        /* Main Container */
        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 40px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-light);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* Side Drawer for Categories */
        .category-drawer {
            position: fixed;
            left: 0;
            top: 0;
            width: 50%;
            max-width: 600px;
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            z-index: 500;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            overflow-y: auto;
            padding: 20px;
        }

        .category-drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .drawer-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .drawer-close {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .drawer-close:hover {
            background: var(--error);
            color: white;
        }

        .drawer-clear {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
            margin-right: 8px;
        }

        .drawer-clear:hover {
            background: var(--warning);
            color: white;
            transform: scale(1.05);
        }

        .drawer-clear:active {
            transform: scale(0.95);
        }

        .drawer-toggle {
            position: fixed;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: var(--accent);
            border: none;
            border-radius: 0 12px 12px 0;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 400;
            box-shadow: var(--shadow-md);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .drawer-toggle:hover {
            background: var(--accent-hover);
            transform: translateY(-50%) translateX(4px);
        }

        .drawer-toggle.open {
            left: calc(min(50%, 600px) - 24px);
        }

        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 450;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }

        .main-content {
            transition: margin-left 0.3s ease;
        }

        .main-content.drawer-open {
            margin-left: 0;
        }

        /* Tag Filter Bar - Now in drawer */
        .tag-filter-bar {
            padding: 0;
        }

        .tag-category-group {
            margin-bottom: 16px;
        }

        .tag-category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
            color: var(--text-primary);
            user-select: none;
        }

        .tag-category-header:hover {
            background: var(--bg-glass-hover);
            border-color: var(--accent);
        }

        .tag-category-header.active {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        .tag-category-header.has-selected {
            background: rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
            color: #93c5fd;
        }

        .tag-category-header.has-selected:hover {
            background: rgba(59, 130, 246, 0.4);
            border-color: #60a5fa;
        }

        .tag-category-icon {
            font-size: 18px;
            transition: transform 0.2s;
        }

        .tag-category-header.collapsed .tag-category-icon {
            transform: rotate(-90deg);
        }

        .tag-category-expand {
            margin-left: auto;
            font-size: 12px;
            opacity: 0.6;
        }

        .tag-category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
            padding-left: 8px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease, padding-top 0.3s ease;
        }

        .tag-category-group.expanded .tag-category-tags {
            max-height: 500px;
            padding-top: 12px;
        }

        .tag-filter {
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .tag-filter:hover {
            background: var(--bg-glass-hover);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .tag-filter.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .category-manage-btn {
            margin-left: auto;
            padding: 4px 8px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .category-manage-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Image Grid */
        .images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .images-grid.list-view {
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .image-card {
            position: relative;
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            aspect-ratio: 1;
        }

        .image-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--accent);
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* List View Styles */
        .image-card.list-row {
            display: grid;
            grid-template-columns: 110px 1fr 150px 150px 120px 80px 80px 140px;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            aspect-ratio: unset;
            height: auto;
            min-height: 110px;
        }

        .image-card.list-row img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .image-card.list-row .image-overlay {
            display: none;
        }

        .image-card.list-row .list-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .image-card.list-row .list-info .filename {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-card.list-row .list-info .list-meta {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-card.list-row .list-cell {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            padding-right: 8px;
        }

        .image-card.list-row .image-actions {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            align-items: center;
        }

        .list-header {
            display: grid;
            grid-template-columns: 110px 1fr 150px 150px 120px 80px 80px 140px;
            gap: 12px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            align-items: center;
        }

        .list-header > div:first-child {
            text-align: center;
        }

        .list-header > div:nth-child(n+3):nth-child(-n+7) {
            text-align: left;
        }

        .list-header > div:last-child {
            text-align: right;
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .image-card:hover .image-overlay {
            transform: translateY(0);
        }

        .image-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .image-tag {
            padding: 4px 10px;
            background: var(--accent-light);
            border: 1px solid var(--accent);
            border-radius: 12px;
            font-size: 11px;
            color: var(--accent-hover);
        }

        .image-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .image-card:hover .image-actions {
            opacity: 1;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--accent);
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .modal-title {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--error);
            color: white;
        }

        /* Tag Selection UI */
        .tag-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .category-block {
            background: var(--bg-glass);
            backdrop-filter: var(--blur);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .category-block:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .category-block.active {
            border-color: var(--accent);
            background: var(--accent-light);
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .category-title.has-selected {
            background: rgba(59, 130, 246, 0.3);
            color: #93c5fd;
        }

        .category-icon {
            font-size: 1.5rem;
        }

        .category-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-tag {
            padding: 6px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-secondary);
        }

        .category-tag:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        .category-tag.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Image Preview in Modal */
        .image-preview-container {
            margin-bottom: 30px;
            text-align: center;
        }

        .image-preview {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 30px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--error);
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* File Input Hidden */
        .file-input-hidden {
            display: none;
        }

        /* Full Screen Detail View */
        .detail-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .detail-view.active {
            display: flex;
        }

        .detail-header {

        // Full Guru Manager parsing system
        const LR = /<lora:([^:>]+)(?::([^:>]+))?(?::([^:>]+))?>/g;

        async function decompressZlib(data) {
            try {
                const ds = new DecompressionStream('deflate-raw');
                const writer = ds.writable.getWriter();
                writer.write(data.slice(2, data.length - 4));
                writer.close();
                return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
            } catch (e) {
                try {
                    const ds = new DecompressionStream('deflate');
                    const writer = ds.writable.getWriter();
                    writer.write(data);
                    writer.close();
                    return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
                } catch(e2) {
                    return null;
                }
            }
        }

        function cleanTextForParsing(text) {
            if (!text) return "";
            // Remove null bytes (common in UTF-16 encoded EXIF UserComment)
            let cleaned = text.replace(/\0/g, '');
            // Remove other control characters except newlines
            cleaned = cleaned.replace(/[\x00-\x08\x0B-\x0C\x0E-\x1F]/g, '');
            // Normalize whitespace
            cleaned = cleaned.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            return cleaned;
        }

        function extractEXIFUserComment(exifData) {
            // Extract UserComment from EXIF data (tag 37510 = 0x927C)
            try {
                const dataView = new DataView(exifData.buffer || exifData);
                let offset = 0;
                
                // EXIF structure: TIFF header, IFD entries
                // Look for UserComment tag (37510 = 0x927C)
                while (offset < exifData.length - 12) {
                    const tag = dataView.getUint16(offset, true); // little-endian
                    if (tag === 37510) { // UserComment tag
                        const type = dataView.getUint16(offset + 2, true);
                        const count = dataView.getUint32(offset + 4, true);
                        const valueOffset = dataView.getUint32(offset + 8, true);
                        
                        if (count > 0 && valueOffset < exifData.length) {
                            const valueData = new Uint8Array(exifData, valueOffset, Math.min(count, exifData.length - valueOffset));
                            
                            // Check encoding indicator (first 8 bytes)
                            if (valueData.length > 8) {
                                const encoding = String.fromCharCode(...valueData.slice(0, 8)).replace(/\0/g, '');
                                
                                if (encoding.includes('UNICODE') || encoding.includes('Unicode')) {
                                    // UTF-16 encoding - try both LE and BE, use whichever produces valid text
                                    const textData = valueData.slice(8);
                                    try {
                                        const decodedLE = new TextDecoder('utf-16le', {fatal: false}).decode(textData);
                                        // Check if UTF-16LE produced valid-looking text (contains expected markers)
                                        if (decodedLE && (decodedLE.includes('Negative prompt:') || decodedLE.includes('Steps:') || 
                                            decodedLE.includes('负面提示') || decodedLE.includes('步骤') ||
                                            (decodedLE.length > 50 && /Steps?\s*[:：]\s*\d+/.test(decodedLE)))) {
                                            return decodedLE;
                                        }
                                    } catch(e) {}
                                    
                                    // Try UTF-16BE
                                    try {
                                        const decodedBE = new TextDecoder('utf-16be', {fatal: false}).decode(textData);
                                        // Check if UTF-16BE produced valid-looking text
                                        if (decodedBE && (decodedBE.includes('Negative prompt:') || decodedBE.includes('Steps:') || 
                                            decodedBE.includes('负面提示') || decodedBE.includes('步骤') ||
                                            (decodedBE.length > 50 && /Steps?\s*[:：]\s*\d+/.test(decodedBE)))) {
                                            return decodedBE;
                                        }
                                        // If LE didn't work but BE decoded something, prefer BE
                                        if (decodedBE && decodedBE.length > 10) {
                                            return decodedBE;
                                        }
                                    } catch(e2) {}
                                    
                                    // Fallback: return LE result even if it doesn't look perfect
                                    try {
                                        return new TextDecoder('utf-16le', {fatal: false}).decode(textData);
                                    } catch(e3) {
                                        return new TextDecoder('utf-8', {fatal: false}).decode(valueData.slice(8));
                                    }
                                } else if (encoding.includes('ASCII')) {
                                    // ASCII encoding
                                    return new TextDecoder('ascii', {fatal: false}).decode(valueData.slice(8));
                                } else {
                                    // Try UTF-8
                                    return new TextDecoder('utf-8', {fatal: false}).decode(valueData);
                                }
                            } else {
                                // Short value, try direct decode
                                return new TextDecoder('utf-8', {fatal: false}).decode(valueData);
                            }
                        }
                    }
                    offset += 12; // Move to next IFD entry
                }
            } catch(e) {
                // EXIF parsing failed, return null
            }
            return null;
        }

        function extractEXIFUserCommentFromJPEG(buffer) {
            // Extract EXIF from JPEG (starts with 0xFFE1 APP1 marker)
            try {
                const view = new DataView(buffer);
                let offset = 2; // Skip JPEG SOI marker (0xFFD8)
                
                while (offset < buffer.byteLength - 4) {
                    // Look for APP1 marker (0xFFE1) which contains EXIF
                    if (view.getUint8(offset) === 0xFF && view.getUint8(offset + 1) === 0xE1) {
                        const segmentLength = view.getUint16(offset + 2);
                        const segmentData = new Uint8Array(buffer, offset + 4, segmentLength - 2);
                        
                        // Check if this is EXIF segment (starts with "Exif\0\0")
                        if (segmentLength > 6) {
                            const header = String.fromCharCode(...segmentData.slice(0, 6));
                            if (header === 'Exif\0\0') {
                                // Extract UserComment from EXIF data
                                const exifData = segmentData.slice(6);
                                const userComment = extractEXIFUserComment(exifData);
                                if (userComment) return userComment;
                            }
                        }
                        
                        offset += segmentLength + 2;
                    } else {
                        offset++;
                    }
                }
                
                // Fallback: Search for UserComment text patterns directly in buffer
                // This is more reliable than parsing EXIF structure
                const bufferArray = new Uint8Array(buffer);
                
                // Search for "UNICODE" marker followed by text patterns
                const unicodeMarker = new TextEncoder().encode('UNICODE');
                for (let i = 0; i < bufferArray.length - unicodeMarker.length - 100; i++) {
                    let match = true;
                    for (let j = 0; j < unicodeMarker.length; j++) {
                        if (bufferArray[i + j] !== unicodeMarker[j]) {
                            match = false;
                            break;
                        }
                    }
                    if (match) {
                        // Found UNICODE marker, try to decode as UTF-16LE from this point
                        try {
                            const textData = bufferArray.slice(i + 8); // Skip "UNICODE\0\0"
                            const decoded = new TextDecoder('utf-16le', {fatal: false}).decode(textData);
                            if (decoded.includes('Negative prompt:') || decoded.includes('Steps:') || decoded.includes('masterpiece')) {
                                return decoded;
                            }
                        } catch(e) {}
                    }
                }
            } catch(e) {
                // EXIF extraction failed
            }
            return null;
        }

        async function extractText(buffer) {
            const view = new DataView(buffer);
            let fullText = "";
            try {
                if (view.getUint32(0) === 0x89504E47) {
                    // PNG file - extract text chunks
                    let offset = 8;
                    while (offset < view.byteLength) {
                        if (offset + 4 > view.byteLength) break;
                        const len = view.getUint32(offset);
                        const type = String.fromCharCode(...new Uint8Array(buffer, offset + 4, 4));
                        if (offset + 8 + len > view.byteLength) break;
                        const data = new Uint8Array(buffer, offset + 8, len);
                        if (type === 'tEXt' || type === 'iTXt') {
                            try {
                                fullText += new TextDecoder('utf-8').decode(data).replace(/\0/g, '') + "\n";
                            } catch(e) {
                                fullText += new TextDecoder('latin1').decode(data).replace(/\0/g, '') + "\n";
                            }
                        } else if (type === 'zTXt') {
                            const inflated = await decompressZlib(data);
                            if (inflated) fullText += inflated + "\n";
                        }
                        offset += len + 12;
                        if (type === 'IEND') break;
                    }
                } else if (view.getUint32(0) === 0x52494646 || view.getUint16(0) === 0xFFD8) {
                    // JPEG or WebP - extract EXIF UserComment
                    const exifText = extractEXIFUserCommentFromJPEG(buffer);
                    if (exifText) {
                        fullText = exifText;
                    } else {
                        // Fallback: try multiple decoding methods to find metadata
                        // Method 1: Try UTF-16LE (common in EXIF UserComment)
                        try {
                            const utf16Text = new TextDecoder('utf-16le', {fatal: false}).decode(new Uint8Array(buffer));
                            if (utf16Text.includes('Negative prompt:') || utf16Text.includes('Steps:') || 
                                utf16Text.includes('masterpiece') || utf16Text.includes('best quality')) {
                                fullText = utf16Text;
                            }
                        } catch(e) {}
                        
                        // Method 2: Try UTF-16BE
                        if (!fullText) {
                            try {
                                const utf16Text = new TextDecoder('utf-16be', {fatal: false}).decode(new Uint8Array(buffer));
                                if (utf16Text.includes('Negative prompt:') || utf16Text.includes('Steps:') || 
                                    utf16Text.includes('masterpiece') || utf16Text.includes('best quality')) {
                                    fullText = utf16Text;
                                }
                            } catch(e) {}
                        }
                        
                        // Method 3: Try UTF-8 (may have null bytes)
                        if (!fullText) {
                            fullText = new TextDecoder('utf-8', {fatal: false}).decode(new Uint8Array(buffer));
                        }
                    }
                }
            } catch(e) {
                console.warn('Metadata extraction error:', e);
            }
            // Clean up null bytes and normalize text (handles UTF-16 encoding issues)
            fullText = cleanTextForParsing(fullText);
            return fullText;
        }

        function extractJSON(str, startPos = 0) {
            const start = str.indexOf('{', startPos);
            if (start === -1) return null;
            let count = 0, end = -1;
            for (let i = start; i < str.length; i++) {
                if (str[i] === '{') count++;
                else if (str[i] === '}') count--;
                if (count === 0) { end = i; break; }
            }
            if (end !== -1) {
                try {
                    return {json: JSON.parse(str.substring(start, end + 1)), end: end + 1};
                } catch(e) {
                    return null;
                }
            }
            return null;
        }

        function parseComfy(json) {
            let pos = "", neg = "", meta = {model: "?", size: "?", seed: "?", steps: "?", cfg: "?", sampler: "?"}, resources = [];
            let nodes = [];
            let nodeMap = {};
            
            if (json.nodes && Array.isArray(json.nodes)) {
                nodes = json.nodes.map(n => {
                    const node = {
                        class_type: n.type || n.data?.class_type || "",
                        inputs: n.inputs || n.data?.inputs || (n.widgets_values ? {} : {})
                    };
                    if (n.id !== undefined) nodeMap[n.id] = node;
                    return node;
                }).filter(n => n.class_type || n.inputs);
            } else {
                const vals = Object.values(json);
                nodes = vals.filter(n => n && typeof n === 'object' && (n.class_type || n.inputs));
                vals.forEach((n, i) => {
                    if (n && typeof n === 'object' && (n.class_type || n.inputs)) {
                        const key = Object.keys(json)[i];
                        if (key && !isNaN(key)) nodeMap[key] = n;
                    }
                });
            }

            const findUpstreamText = (l, d = 0) => {
                if (d > 10 || !l || !Array.isArray(l)) return "";
                let n = null;
                if (typeof l[0] === 'string' || typeof l[0] === 'number') {
                    n = json[l[0]] || nodeMap[l[0]];
                } else if (typeof l[0] === 'object') {
                    n = l[0];
                }
                if (!n) return "";
                const inputs = n.inputs || {};
                if (!inputs && !n.widgets_values) return "";
                let t = "";
                
                if (Array.isArray(n.widgets_values) && n.widgets_values.length > 0 && typeof n.widgets_values[0] === 'string') {
                    t += n.widgets_values[0];
                }
                if (typeof inputs.text === 'string') {
                    t += (t ? ", " : "") + inputs.text;
                } else if (Array.isArray(inputs.text)) {
                    const r = findUpstreamText(inputs.text, d + 1);
                    if (r) t += (t ? ", " : "") + r;
                }
                if (typeof inputs.text_g === 'string') t += (t ? ", " : "") + inputs.text_g;
                if (typeof inputs.text_l === 'string') t += (t ? ", " : "") + inputs.text_l;
                if (inputs.string_field) t += (t ? ", " : "") + inputs.string_field;
                
                for (const key in inputs) {
                    if (key.startsWith('string_') || key.startsWith('str_') || key.includes('text') || key.includes('prompt')) {
                        const val = inputs[key];
                        if (typeof val === 'string' && val.length > 0) {
                            if (key !== 'delimiter' || val.length > 1) t += (t ? "" : "") + val;
                        } else if (Array.isArray(val) && val.length > 0) {
                            const r = findUpstreamText(val, d + 1);
                            if (r) t += (t ? ", " : "") + r;
                        }
                    }
                }
                
                if (inputs.trigger_words_display && Array.isArray(inputs.trigger_words_display.__value__)) {
                    const tags = inputs.trigger_words_display.__value__.filter(x => x.active).map(x => x.text).join(", ");
                    if (tags) t += (t ? ", " : "") + tags;
                }
                
                const keys = ['positive', 'negative', 'conditioning', 'clip', 'prompt', 'trigger_words'];
                for (const k of keys) {
                    if (inputs[k]) {
                        const r = findUpstreamText(inputs[k], d + 1);
                        if (r) t += (t ? ", " : "") + r;
                    }
                }
                
                if (!t) {
                    for (const key in inputs) {
                        const val = inputs[key];
                        if (Array.isArray(val) && val.length > 0 && (typeof val[0] === 'string' || typeof val[0] === 'number')) {
                            const r = findUpstreamText(val, d + 1);
                            if (r) { t = r; break; }
                        }
                    }
                }
                return t;
            };

            const findUpstreamModel = (l, d = 0) => {
                if (d > 10 || !l || !Array.isArray(l)) return "";
                let n = null;
                if (typeof l[0] === 'string' || typeof l[0] === 'number') {
                    n = json[l[0]] || nodeMap[l[0]];
                } else if (typeof l[0] === 'object') {
                    n = l[0];
                }
                if (!n) return "";
                const inputs = n.inputs || {};
                if (inputs.ckpt_name) return inputs.ckpt_name;
                if (inputs.unet_name) return inputs.unet_name;
                if (inputs.checkpoint_name) return inputs.checkpoint_name;
                if (inputs.model_name) return inputs.model_name;
                if (inputs.model) return findUpstreamModel(inputs.model, d + 1);
                return "";
            };

            const samplerTypes = ["KSampler", "KSamplerAdvanced", "SamplerCustom", "SamplerEulerAncestralCFGPP", "SamplerLCM"];
            const ksampler = nodes.find(n => n.class_type && samplerTypes.some(type => n.class_type.includes(type)));
            
            if (ksampler) {
                const inputs = ksampler.inputs || {};
                meta.seed = inputs.seed || inputs.noise_seed || "?";
                meta.steps = inputs.steps || "?";
                meta.cfg = inputs.cfg || "?";
                meta.sampler = inputs.sampler_name || ksampler.class_type || "?";
                if (inputs.scheduler) meta.sampler += " " + inputs.scheduler;
                if (inputs.positive) pos = findUpstreamText(inputs.positive);
                if (inputs.negative) neg = findUpstreamText(inputs.negative);
                if (inputs.model) meta.model = findUpstreamModel(inputs.model).replace(/\.(safetensors|ckpt)$/, "");
            }

            nodes.forEach(n => {
                const nodeType = n.class_type || "";
                const inputs = n.inputs || {};
                if (inputs.lora_name) resources.push({type: 'LoRA', name: inputs.lora_name.replace(/\.(safetensors|ckpt)$/, ""), str: inputs.strength_model});
                if (nodeType.includes("Power Lora Loader")) {
                    for (const [k, v] of Object.entries(inputs)) {
                        if (k.startsWith('lora_') && v?.on) {
                            resources.push({type: 'LoRA', name: v.lora.replace(/\.(safetensors|ckpt)$/, ""), str: v.strength});
                        }
                    }
                }
                if (inputs.loras && Array.isArray(inputs.loras.__value__)) {
                    inputs.loras.__value__.forEach(l => {
                        if (l.name && l.active !== false) {
                            resources.push({type: 'LoRA', name: l.name, str: l.strength});
                        }
                    });
                }
                if (nodeType.includes("ControlNet") && inputs.control_net_name) {
                    resources.push({type: 'ControlNet', name: inputs.control_net_name, str: inputs.strength || "1.0"});
                }
                if (nodeType.includes("IPAdapter") && inputs.ipadapter_file) {
                    resources.push({type: 'IP-Adapter', name: inputs.ipadapter_file, str: inputs.weight || "1.0"});
                }
            });

            const sizeNodes = ["EmptyLatentImage", "LatentUpscale", "LatentComposite", "EmptySD3LatentImage"];
            const sizeNode = nodes.find(n => sizeNodes.includes(n.class_type));
            if (sizeNode) {
                const inputs = sizeNode.inputs || {};
                if (inputs.width && inputs.height) meta.size = `${inputs.width}x${inputs.height}`;
            }
            
            return {pos, neg, meta, resources};
        }

        function parseA1111(text) {
            let pos = "", neg = "";
            let resources = [];
            let meta = { model: "?", size: "?", seed: "?", steps: "?", cfg: "?", sampler: "?" };

            // Clean text - remove any remaining control characters
            text = text.replace(/[\x00-\x08\x0B-\x0C\x0E-\x1F]/g, '');

            let match;
            LR.lastIndex = 0;
            while ((match = LR.exec(text)) !== null) {
                resources.push({type: 'LoRA', name: match[1], str: match[2] || "1.0"});
            }

            // Try multiple marker variations (case-insensitive)
            const negMarkers = ["Negative prompt:", "Negative Prompt:", "negative prompt:", "Negative prompt"];
            const stepsMarkers = ["Steps:", "Steps", "Step:"];
            
            let negIdx = -1, stepsIdx = -1;
            let negMarker = "";
            
            // Find negative prompt marker
            for (const marker of negMarkers) {
                const idx = text.indexOf(marker);
                if (idx !== -1) {
                    negIdx = idx;
                    negMarker = marker;
                    break;
                }
            }
            
            // Find steps marker
            for (const marker of stepsMarkers) {
                const idx = text.indexOf(marker);
                if (idx !== -1) {
                    stepsIdx = idx;
                    break;
                }
            }

            // Extract prompts
            if (negIdx !== -1 && stepsIdx !== -1 && negIdx < stepsIdx) {
                pos = text.substring(0, negIdx).replace(/parameters\s*/i, "").trim();
                neg = text.substring(negIdx + negMarker.length, stepsIdx).trim();
            } else if (stepsIdx !== -1) {
                pos = text.substring(0, stepsIdx).replace(/parameters\s*/i, "").trim();
            } else if (negIdx !== -1) {
                // Only negative marker found
                pos = text.substring(0, negIdx).replace(/parameters\s*/i, "").trim();
                neg = text.substring(negIdx + negMarker.length).trim();
            } else {
                // No markers found - try to extract from JSON or use whole text
                if(text.includes('"widgets_values"')) {
                    const parts = text.split(/"text":\s*"/);
                    if(parts.length > 1) pos = parts[1].split('"')[0];
                } else {
                    // Check if it's just a prompt without metadata markers
                    pos = text.trim();
                }
            }

            // Extract parameters - improved regex patterns
            if (stepsIdx !== -1) {
                const block = text.substring(stepsIdx);
                
                // More flexible parameter extraction
                const getParam = (key, patterns) => {
                    for (const pattern of patterns) {
                        const regex = new RegExp(pattern, 'i');
                        const match = block.match(regex);
                        if (match && match[1]) {
                            return match[1].trim();
                        }
                    }
                    return "?";
                };
                
                meta.steps = getParam("Steps", [
                    "Steps:\\s*([0-9]+)",
                    "Steps\\s*:\\s*([0-9]+)",
                    "Steps\\s+([0-9]+)"
                ]);
                
                meta.sampler = getParam("Sampler", [
                    "Sampler:\\s*([^,\\n]+)",
                    "Sampler\\s*:\\s*([^,\\n]+)",
                    "Sampler\\s+([^,\\n]+)"
                ]);
                
                meta.cfg = getParam("CFG", [
                    "CFG\\s+scale:\\s*([0-9.]+)",
                    "CFG\\s*scale\\s*:\\s*([0-9.]+)",
                    "CFG\\s*:\\s*([0-9.]+)",
                    "CFG scale\\s*:\\s*([0-9.]+)"
                ]);
                
                meta.seed = getParam("Seed", [
                    "Seed:\\s*([0-9]+)",
                    "Seed\\s*:\\s*([0-9]+)",
                    "Seed\\s+([0-9]+)"
                ]);
                
                meta.size = getParam("Size", [
                    "Size:\\s*([0-9xX]+)",
                    "Size\\s*:\\s*([0-9xX]+)",
                    "Size\\s+([0-9xX]+)"
                ]);
                
                meta.model = getParam("Model", [
                    "Model:\\s*([^,\\n]+)",
                    "Model\\s*:\\s*([^,\\n]+)",
                    "Model\\s+([^,\\n]+)"
                ]);
            }

            return {pos, neg, resources, meta};
        }

        function parseMetadata(text) {
            let comfyResult = null;
            if (text.includes('"class_type"') && text.includes('"inputs"')) {
                let pos = 0;
                while (true) {
                    const result = extractJSON(text, pos);
                    if (!result) break;
                    const json = result.json;
                    pos = result.end;
                    if (json && (json.class_type || json.nodes || Object.values(json).some(v => v && typeof v === 'object' && (v.class_type || v.type)))) {
                        const parsed = parseComfy(json);
                        if (parsed && (parsed.pos || parsed.meta.model !== "?")) {
                            comfyResult = parsed;
                            break;
                        }
                    }
                }
            }
            if (!comfyResult && (text.includes('"class_type"') || text.includes('"type"') || (text.includes('"inputs"') && (text.includes('KSampler') || text.includes('CLIPTextEncode') || text.includes('SaveImage') || text.includes('CLIPLoader') || text.includes('VAELoader'))))) {
                let pos = 0;
                while (true) {
                    const result = extractJSON(text, pos);
                    if (!result) break;
                    const json = result.json;
                    pos = result.end;
                    if (json && (json.class_type || json.nodes || json.type || Object.values(json).some(v => v && typeof v === 'object' && (v.class_type || v.type)))) {
                        const parsed = parseComfy(json);
                        if (parsed && (parsed.pos || parsed.meta.model !== "?")) {
                            comfyResult = parsed;
                            break;
                        }
                    }
                }
            }
            if (comfyResult) return comfyResult;
            return parseA1111(text);
        }

        // Suggest tags from parsed metadata
        function suggestTagsFromMetadata(parsed) {
            const suggestedTags = [];
            const promptLower = (parsed.pos || '').toLowerCase();
            
            // Get all tags from database and default categories
            const allCategoryTags = {};
            Object.entries(TAG_CATEGORIES).forEach(([category, data]) => {
                allCategoryTags[category] = [...data.tags];
            });
            
            // Load custom tags from database
            if (db) {
                try {
                    const customTags = db.exec(`SELECT category, tag_name FROM custom_tags;`);
                    if (customTags.length > 0 && customTags[0].values.length > 0) {
                        customTags[0].values.forEach(row => {
                            const [category, tagName] = row;
                            if (allCategoryTags[category] && !allCategoryTags[category].includes(tagName)) {
                                allCategoryTags[category].push(tagName);
                            }
                        });
                    }
                } catch (e) {
                    console.warn('Error loading custom tags:', e);
                }
            }
            
            // Match tags from prompt
            Object.entries(allCategoryTags).forEach(([category, tags]) => {
                tags.forEach(tag => {
                    if (promptLower.includes(tag.toLowerCase())) {
                        suggestedTags.push({category, tag});
                    }
                });
            });
            
            return suggestedTags;
        }

                const previewSrc = imagePreview?.src;

        // Preview image file
        async function previewImageFile(input) {
            if (!input.files || !input.files[0]) return;
            
            const file = input.files[0];
            const reader = new FileReader();
            
            reader.onload = async (e) => {
                const preview = document.getElementById('imagePreview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                
                // Extract metadata using full Guru Manager parsing
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const metadataText = await extractText(arrayBuffer);
                    const parsed = parseMetadata(metadataText);
                    
                    // Auto-fill prompts
                    document.getElementById('positivePrompt').value = parsed.pos || '';
                    document.getElementById('negativePrompt').value = parsed.neg || '';
                    
                    // Suggest tags from metadata
                    const suggestedTags = suggestTagsFromMetadata(parsed);
                    
                    // Auto-select suggested tags
                    selectedTags.clear();
                    suggestedTags.forEach(({tag}) => {
                        selectedTags.add(tag);
                    });
                    
                    renderTagCategories();
                    
                    if (suggestedTags.length > 0) {
                        showToast(`Found ${suggestedTags.length} suggested tags from metadata!`, 'success');
                    } else if (parsed.pos || parsed.neg) {
                        showToast('Metadata parsed successfully!', 'success');
                    }
                } catch (error) {
                    console.error('Error extracting metadata:', error);
                    showToast('Error parsing metadata: ' + error.message, 'error');
                }
            };
            
            reader.readAsDataURL(file);
        }

        // Load tags for a category (default + custom from database)
        function getCategoryTags(category) {
            const defaultTags = TAG_CATEGORIES[category]?.tags || [];
            const customTags = [];
            
            if (db) {
                try {
                    const result = db.exec(`SELECT tag_name FROM custom_tags WHERE category = ?;`, [category]);
                    if (result.length > 0 && result[0].values.length > 0) {
                        result[0].values.forEach(row => {
                            customTags.push(row[0]);
                        });
                    }
                } catch (e) {
                    console.warn('Error loading custom tags:', e);
                }
            }
            
            return [...new Set([...defaultTags, ...customTags])];
        }

        // Render tag categories
        function renderTagCategories() {
            const container = document.getElementById('tagCategoriesContainer');
            if (!container) return;
            
            container.innerHTML = '';
            
            // Get all categories (default + custom)
            const allCategories = getAllCategories();
            
            // Sort categories: default first, then custom, then Other
            const sortedCategories = Object.entries(allCategories).sort(([a], [b]) => {
                const aIsDefault = TAG_CATEGORIES.hasOwnProperty(a);
                const bIsDefault = TAG_CATEGORIES.hasOwnProperty(b);
                if (aIsDefault && !bIsDefault) return -1;
                if (!aIsDefault && bIsDefault) return 1;
                if (a === 'Other') return 1;
                if (b === 'Other') return -1;
                return a.localeCompare(b);
            });
            
            sortedCategories.forEach(([category, data]) => {
                const tags = getCategoryTags(category);
                
                // Check if any tags in this category are selected
                const hasSelectedTags = tags.some(tag => selectedTags.has(tag));
                const titleClass = hasSelectedTags ? 'category-title has-selected' : 'category-title';
                
                const block = document.createElement('div');
                block.className = 'category-block';
                block.innerHTML = `
                    <div class="${titleClass}">
                        <span class="category-icon">${data.icon || '📁'}</span>
                        <span>${category}</span>
                        <button class="edit-category-btn" onclick="showEditCategoryModal('${category.replace(/'/g, "\\'")}')" title="Edit Tags">✏️</button>
                    </div>
                    <div class="category-tags">
                        ${tags.map(tag => `
                            <span class="category-tag ${selectedTags.has(tag) ? 'selected' : ''}" 
                                  onclick="toggleTag('${tag.replace(/'/g, "\\'")}', '${category.replace(/'/g, "\\'")}')">${tag}</span>
                        `).join('')}
                    </div>
                `;
                container.appendChild(block);
            });
        }

        // Add custom tag
        function addCustomTag(category) {
            const input = document.getElementById('newTagInput');
            const tagName = input.value.trim();
            
            if (!tagName) return;
            
            if (!db) {
                showToast('Please create or import a database first', 'error');
                return;
            }
            
            try {
                // Add to custom_tags table
                db.run(`INSERT OR IGNORE INTO custom_tags (category, tag_name) VALUES (?, ?);`, [category, tagName]);
                
                // Also update any existing image_tags to use this category
                db.run(`UPDATE image_tags SET category = ? WHERE tag_name = ? AND (category IS NULL OR category = 'Other');`, [category, tagName]);
                
                showToast(`Tag "${tagName}" added to ${category}!`, 'success');
                if (typeof markUnsaved === 'function') markUnsaved();
                input.value = '';

        // Save image
        async function saveImage(event) {
            event.preventDefault();
            if (!db) {
                showToast('Please create or import a database first', 'error');
                // Auto-initialize database for new users
                await initializeDatabase();
                if (!db) {
                    showToast('Failed to create database. Please try again.', 'error');
                    return;
                }
            }

            const formData = new FormData(event.target);
            let imageFile = formData.get('imageFile');
            let imageData = null;
            let metadataText = '';
            let parsed = {pos: '', neg: '', meta: {}, resources: []};
            
            // If editing, try to get existing image data
            if (currentImageId && (!imageFile || !imageFile.size)) {
                const existingResult = db.exec(`SELECT image_data, metadata_text FROM images WHERE id = ?;`, [currentImageId]);
                if (existingResult.length > 0 && existingResult[0].values.length > 0) {
                    imageData = new Uint8Array(existingResult[0].values[0][0]);
                    metadataText = existingResult[0].values[0][1] || '';
                    if (metadataText) {
                        parsed = parseMetadata(metadataText);
                    }
                }
            } else if (imageFile && imageFile.size) {
                const arrayBuffer = await imageFile.arrayBuffer();
                imageData = new Uint8Array(arrayBuffer);
                
                // Extract metadata using full Guru Manager parsing
                metadataText = await extractText(arrayBuffer);
                parsed = parseMetadata(metadataText);
            }
            
            if (!imageData) {
                showToast('Please select an image', 'error');
                return;
            }
            
            try {
                // Use parsed values if available, otherwise use form values
                const positivePrompt = parsed.pos || formData.get('positivePrompt') || '';
                const negativePrompt = parsed.neg || formData.get('negativePrompt') || '';

                // Use parsed metadata if available
                const finalModel = parsed.meta?.model !== '?' ? parsed.meta.model : '?';
                const finalSeed = parsed.meta?.seed !== '?' ? parsed.meta.seed : '?';
                const finalSteps = parsed.meta?.steps !== '?' ? parsed.meta.steps : '?';
                const finalCfg = parsed.meta?.cfg !== '?' ? parsed.meta.cfg : '?';
                const finalSampler = parsed.meta?.sampler !== '?' ? parsed.meta.sampler : '?';
                const finalSize = parsed.meta?.size !== '?' ? parsed.meta.size : '?';

                const filename = imageFile ? imageFile.name : (currentImageId ? 
                    db.exec(`SELECT filename FROM images WHERE id = ?;`, [currentImageId])[0].values[0][0] : 'image.png');
                
                // Use current folder if set, otherwise null (all folders)
                const folderId = currentFolderId || null;
                
                if (currentImageId) {
                    // Update existing
                    db.run(
                        `UPDATE images SET filename=?, image_data=?, positive_prompt=?, negative_prompt=?, model=?, seed=?, steps=?, cfg=?, sampler=?, size=?, metadata_text=?, folder_id=? WHERE id=?;`,
                        [
                            filename, imageData, positivePrompt, negativePrompt,
                            finalModel, finalSeed, finalSteps, finalCfg, finalSampler, finalSize, metadataText, folderId,
                            currentImageId
                        ]
                    );
                    
                    // Update tags
                    db.run(`DELETE FROM image_tags WHERE image_id=?;`, [currentImageId]);
                } else {
                    // Insert new
                    db.run(
                        `INSERT INTO images (filename, image_data, positive_prompt, negative_prompt, model, seed, steps, cfg, sampler, size, metadata_text, folder_id) 
                         VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);`,
                        [
                            filename, imageData, positivePrompt, negativePrompt,
                            finalModel, finalSeed, finalSteps, finalCfg, finalSampler, finalSize, metadataText, folderId
                        ]
                    );
                    
                    const result = db.exec(`SELECT last_insert_rowid() as id;`);
                    currentImageId = result[0].values[0][0];
                }

                // Save tags with proper category assignment
                selectedTags.forEach(tag => {
                    // Find category for tag - check default categories first
                    let category = Object.entries(TAG_CATEGORIES).find(([_, data]) => 
                        data.tags.includes(tag)
                    )?.[0];
                    
                    // If not in default categories, check custom tags
                    if (!category && db) {
                        try {
                            const customResult = db.exec(`SELECT category FROM custom_tags WHERE tag_name = ? LIMIT 1;`, [tag]);
                            if (customResult.length > 0 && customResult[0].values.length > 0) {
                                category = customResult[0].values[0][0];
                            }
                        } catch (e) {
                            console.warn('Error checking custom tag category:', e);
                        }
                    }
                    
                    // Default to 'Other' if category not found
                    category = category || 'Other';
                    
                    db.run(
                        `INSERT INTO image_tags (image_id, tag_name, category) VALUES (?, ?, ?);`,
                        [currentImageId, tag, category]
                    );
                });

                showToast('Image saved successfully!', 'success');
                isAddingImage = false;
                if (typeof markUnsaved === 'function') markUnsaved();
                closeModal();
                // Force refresh images immediately - use requestAnimationFrame for smooth update
                requestAnimationFrame(() => {
                loadImages();
                    updateTagFilterBar(); // Auto-refresh category counts
                });
            } catch (error) {
                console.error('Error saving image:', error);
                showToast('Error saving image: ' + error.message, 'error');
            }
        }

        // Load images
        function loadImages() {
            if (!db) {
                // Show empty state for no database
                const grid = document.getElementById('imagesGrid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <div class="empty-state-icon">📚</div>
                            <h2>No Database Loaded</h2>
                            <p>Create a new database or import an existing SQLite file to get started.</p>
                            <div style="display: flex; gap: 12px; justify-content: center; margin-top: 20px;">
                                <button class="btn" onclick="initializeDatabase()">🆕 Create New Database</button>
                                <button class="btn btn-secondary" onclick="showImportModal()">📥 Import Database</button>
                            </div>
                        </div>
                    `;
                }
                return;
            }

            try {
                const searchQuery = document.getElementById('searchInput')?.value.toLowerCase() || '';
                let query = `
                    SELECT i.*, GROUP_CONCAT(it.tag_name) as tags
                    FROM images i
                    LEFT JOIN image_tags it ON i.id = it.image_id
                    WHERE 1=1
                `;
                const params = [];

                // Filter by folder if selected
                if (currentFolderId !== null) {
                    query += ` AND i.folder_id = ?`;
                    params.push(currentFolderId);
                }

                if (searchQuery) {
                    query += ` AND (i.filename LIKE ? OR i.positive_prompt LIKE ? OR it.tag_name LIKE ?)`;
                    params.push(`%${searchQuery}%`, `%${searchQuery}%`, `%${searchQuery}%`);
                }

                if (activeFilters.size > 0) {
                    const filterTags = Array.from(activeFilters);
                    query += ` AND it.tag_name IN (${filterTags.map(() => '?').join(',')})`;
                    params.push(...filterTags);
                }

                query += ` GROUP BY i.id ORDER BY i.created_at DESC;`;

                const result = db.exec(query, params);
                const grid = document.getElementById('imagesGrid');
                
                if (!grid) return;
                
                // Clear existing content
                grid.innerHTML = '';
                allTags.clear();
                currentImageList = [];
                
                if (!result.length || !result[0].values.length) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <div class="empty-state-icon">🖼️</div>
                            <h2>No Images Found</h2>
                            <p>Try adjusting your search or filters.</p>
                        </div>

                    return;

                // Limit results for performance (pagination could be added later)
                const maxResults = 1000;

                if (result[0].values.length > maxResults) {
                    showToast(`Showing first ${maxResults} of ${result[0].values.length} images. Use filters to narrow results.`, 'success');

                        <div>Model</div>
                        <div>Sampler</div>
                        <div>Size</div>
                        <div>Steps</div>
                        <div>CFG</div>

                rows.forEach((row, index) => {
                    const columns = result[0].columns;

                    // Store image ID for navigation

                                <div class="list-meta">
                                    ${tags.length > 0 ? tags.slice(0, 3).map(tag => `<span class="image-tag">${tag}</span>`).join('') : ''}
                                    ${tags.length > 3 ? `<span class="image-tag">+${tags.length - 3}</span>` : ''}
                                </div>
                            </div>
                            <div class="list-cell">${image.model || '?'}</div>
                            <div class="list-cell">${image.sampler || '?'}</div>
                            <div class="list-cell">${image.size || '?'}</div>

        // Get all categories (default + custom)
        function getAllCategories() {
            const categories = { ...TAG_CATEGORIES };
            
            // Add "Other" category for uncategorized tags
            if (!categories['Other']) {
                categories['Other'] = {
                    icon: '📦',
                    tags: []
                };
            }
            
            if (db) {
                try {
                    const result = db.exec(`SELECT name, icon FROM custom_categories ORDER BY name;`);
                    if (result.length > 0 && result[0].values.length > 0) {
                        result[0].values.forEach(row => {
                            const [name, icon] = row;
                            if (!categories[name]) {
                                categories[name] = {
                                    icon: icon || '📁',
                                    tags: []
                                };
                            } else if (icon) {
                                // Update icon if custom icon exists
                                categories[name].icon = icon;
                            }
                        });
                    }
                } catch (e) {
                    console.warn('Error loading custom categories:', e);
                }
            }
            
            return categories;
        }
