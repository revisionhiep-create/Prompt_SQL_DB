        // Update tag filter bar with collapsible categories
        function updateTagFilterBar() {
            const bar = document.getElementById('tagFilterBar');
            if (!bar) return;

            bar.innerHTML = '';
            
            // Get all tags grouped by category from database
            const tagsByCategory = {};
            const allCategories = getAllCategories();
            
            // Initialize all categories (including custom ones)
            Object.keys(allCategories).forEach(cat => {
                tagsByCategory[cat] = [];
            });
            
            if (db) {
                try {
                    // Get tags with their categories
                    const tagQuery = `
                        SELECT DISTINCT it.tag_name, COALESCE(it.category, 'Other') as category
                        FROM image_tags it
                        JOIN images i ON it.image_id = i.id
                        ORDER BY it.category, it.tag_name
                    `;
                    
                    const result = db.exec(tagQuery);
                    if (result.length > 0 && result[0].values.length > 0) {
                        result[0].values.forEach(row => {
                            const [tagName, category] = row;
                            const cat = category || 'Other';
                            if (!tagsByCategory[cat]) {
                                tagsByCategory[cat] = [];
                            }
                            if (!tagsByCategory[cat].includes(tagName)) {
                                tagsByCategory[cat].push(tagName);
                            }
                            allTags.add(tagName);
                        });
                    }
                } catch (error) {
                    console.warn('Error loading tags for filter bar:', error);
                }
            }
            
            // Create collapsible category groups - show all categories, even empty ones
            // Sort categories: default first, then custom, then Other
            const sortedCategories = Object.entries(allCategories).sort(([a], [b]) => {
                const aIsDefault = TAG_CATEGORIES.hasOwnProperty(a);
                const bIsDefault = TAG_CATEGORIES.hasOwnProperty(b);
                if (aIsDefault && !bIsDefault) return -1;
                if (!aIsDefault && bIsDefault) return 1;
                if (a === 'Other') return 1;
                if (b === 'Other') return -1;
                return a.localeCompare(b);
            });
            
            sortedCategories.forEach(([categoryName, categoryData]) => {
                const tags = tagsByCategory[categoryName] || [];
                
                const group = document.createElement('div');
                group.className = 'tag-category-group';
                group.dataset.category = categoryName;
                
                const header = document.createElement('div');
                header.className = 'tag-category-header';
                header.innerHTML = `
                    <span class="tag-category-icon">▼</span>
                    <span>${categoryData.icon || '📁'} ${categoryName}</span>
                    <span class="tag-category-expand">(${tags.length})</span>
                    <button class="category-manage-btn" onclick="showCategoryManager('${categoryName.replace(/'/g, "\\'")}', event)" title="Manage Category">⚙️</button>
                `;
                
                const tagsContainer = document.createElement('div');
                tagsContainer.className = 'tag-category-tags';
                
                // Check if any tags in this category are selected (for filtering or in modal)
                const hasSelectedTags = tags.some(tag => activeFilters.has(tag) || selectedTags.has(tag));
                if (hasSelectedTags) {
                    header.classList.add('has-selected');
                }
                
                tags.sort().forEach(tag => {
                const filter = document.createElement('div');
                filter.className = `tag-filter ${activeFilters.has(tag) ? 'active' : ''}`;
                filter.textContent = tag;
                    filter.onclick = (e) => {
                        e.stopPropagation();
                    if (activeFilters.has(tag)) {
                        activeFilters.delete(tag);
                    } else {
                        activeFilters.add(tag);
                    }
                    loadImages();
                        updateTagFilterBar(); // Refresh to update active state and counts
                    };
                    tagsContainer.appendChild(filter);
                });
                
                // Start collapsed by default
                header.classList.add('collapsed');
                
                header.onclick = () => {
                    group.classList.toggle('expanded');
                    header.classList.toggle('collapsed');
                };
                
                group.appendChild(header);
                group.appendChild(tagsContainer);
                bar.appendChild(group);
            });
        }

        // Export database with Save As dialog
        async function exportDatabase() {
            if (!db) {
                showToast('No database to export', 'error');
                return;
            }

            try {
                const data = db.export();
                const blob = new Blob([data], { type: 'application/x-sqlite3' });
                
                // Try File System Access API first (Save As dialog)
                if ('showSaveFilePicker' in window) {
                    try {
                        const fileHandle = await window.showSaveFilePicker({
                            suggestedName: 'PromptDB.sqlite',
                            types: [{
                                description: 'SQLite Database',
                                accept: { 'application/x-sqlite3': ['.sqlite', '.db'] }
                            }]
                        });
                        
                        const writable = await fileHandle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        
                        if (typeof markSaved === 'function') markSaved();
                        showToast('Database exported successfully!', 'success');
                        return;
                    } catch (error) {
                        // User cancelled or error - fall through to download
                        if (error.name !== 'AbortError') {
                            console.warn('File System Access API error:', error);
                        } else {
                            return; // User cancelled
                        }
                    }
                }
                
                // Fallback to download for browsers without File System Access API
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'PromptDB.sqlite';
                a.click();
                URL.revokeObjectURL(url);
                if (typeof markSaved === 'function') markSaved();
                showToast('Database exported successfully!', 'success');
            } catch (error) {
                console.error('Error exporting database:', error);
                showToast('Error exporting: ' + error.message, 'error');
            }
        }

        async function handleFileInput(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.name.endsWith('.sqlite') || file.name.endsWith('.db')) {
                // Import database
                try {
                    await initSQL();
                    const arrayBuffer = await file.arrayBuffer();
                    db = new SQL.Database(new Uint8Array(arrayBuffer));
                    
                    // Migrate existing databases (add folders table if missing)
                    try {
                        db.exec(`CREATE TABLE IF NOT EXISTS folders (
                            id INTEGER PRIMARY KEY AUTOINCREMENT,
                            name TEXT NOT NULL UNIQUE,
                            created_at DATETIME DEFAULT CURRENT_TIMESTAMP
                        );`);
                        
                        // Add folder_id column if it doesn't exist
                        try {
                            db.exec(`ALTER TABLE images ADD COLUMN folder_id INTEGER;`);
                        } catch (e) {
                            // Column already exists, ignore
                        }
                        
                        // Add custom_categories table if it doesn't exist
                        try {
                            db.exec(`CREATE TABLE IF NOT EXISTS custom_categories (
                                id INTEGER PRIMARY KEY AUTOINCREMENT,
                                name TEXT NOT NULL UNIQUE,
                                icon TEXT,
                                created_at DATETIME DEFAULT CURRENT_TIMESTAMP
                            );`);
                        } catch (e) {
                            console.warn('Custom categories table creation error:', e);
                        }
                        
                        // Migrate "All Images" folder if it exists
                        try {
                            const allImagesCheck = db.exec(`SELECT id FROM folders WHERE name = 'All Images';`);
                            if (allImagesCheck.length > 0 && allImagesCheck[0].values.length > 0) {
                                const folderId = allImagesCheck[0].values[0][0];
                                // Move images to null (All Folders)
                                db.run(`UPDATE images SET folder_id = NULL WHERE folder_id = ?;`, [folderId]);
                                // Rename folder to something less confusing
                                db.run(`UPDATE folders SET name = 'My Images' WHERE id = ?;`, [folderId]);
                            }
                        } catch (e) {
                            console.warn('All Images migration error:', e);
                        }
                    } catch (e) {
                        console.warn('Migration error (may be normal):', e);
                    }
                    
                    showToast('Database imported successfully!', 'success');
                    if (typeof markSaved === 'function') markSaved();
                    loadFolders();
                    loadImages();
                } catch (error) {
                    console.error('Error importing database:', error);
                    showToast('Error importing: ' + error.message, 'error');
                }
            } else {
                // Add image
                showAddImageModal();
                // Trigger file input in modal
                setTimeout(() => {
                    const modalInput = document.querySelector('#modal input[type="file"]');
                    if (modalInput) {
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(file);
                        modalInput.files = dataTransfer.files;
                        previewImageFile(modalInput);
                    }
                }, 100);
            }

            event.target.value = '';

                activeElement.tagName === 'INPUT' || 
                activeElement.tagName === 'TEXTAREA' ||

        function saveCategory(oldCategoryName) {
            if (!db) {
                showToast('Database not initialized', 'error');
                return;
            }
            
            const nameInput = document.getElementById('categoryNameInput');
            const iconInput = document.getElementById('categoryIconInput');
            
            if (!nameInput || !iconInput) return;
            
            const newName = nameInput.value.trim();
            const newIcon = iconInput.value.trim() || '📁';
            
            if (!newName) {
                showToast('Category name cannot be empty', 'error');
                return;
            }
            
            const isDefaultCategory = TAG_CATEGORIES.hasOwnProperty(oldCategoryName);
            
            try {
                if (isDefaultCategory) {
                    // Can only update icon for default categories
                    // Store icon in custom_categories table
                    db.run(`INSERT OR REPLACE INTO custom_categories (name, icon) VALUES (?, ?);`, [oldCategoryName, newIcon]);
                    showToast('Category icon updated!', 'success');
                } else {
                    // Custom category - can rename and update icon
                    if (newName !== oldCategoryName) {
                        // Check if new name already exists
                        const checkResult = db.exec(`SELECT id FROM custom_categories WHERE name = ?;`, [newName]);
                        if (checkResult.length > 0 && checkResult[0].values.length > 0 && newName !== oldCategoryName) {
                            showToast('Category name already exists', 'error');
                            return;
                        }
                        
                        // Update category name in custom_categories
                        db.run(`UPDATE custom_categories SET name = ?, icon = ? WHERE name = ?;`, [newName, newIcon, oldCategoryName]);
                        
                        // Update category in custom_tags
                        db.run(`UPDATE custom_tags SET category = ? WHERE category = ?;`, [newName, oldCategoryName]);
                        
                        // Update category in image_tags
                        db.run(`UPDATE image_tags SET category = ? WHERE category = ?;`, [newName, oldCategoryName]);
                        
                        showToast(`Category renamed to "${newName}"!`, 'success');
                    } else {
                        // Just update icon
                        db.run(`UPDATE custom_categories SET icon = ? WHERE name = ?;`, [newIcon, oldCategoryName]);
                        showToast('Category icon updated!', 'success');
                    }
                }
                
                if (typeof markUnsaved === 'function') markUnsaved();
                closeModal();
                // Force refresh to show updated category
                setTimeout(() => {
                    updateTagFilterBar();
                }, 100);
            } catch (error) {
                console.error('Error saving category:', error);
                showToast('Error saving category: ' + error.message, 'error');
            }
        }

                // Get current folder for this image
                const result = db.exec(`SELECT folder_id FROM images WHERE id = ?;`, [imageId]);
                const currentFolderId = result.length > 0 && result[0].values.length > 0 ? result[0].values[0][0] : null;
                
                // Get all folders
                const foldersResult = db.exec(`SELECT id, name FROM folders ORDER BY name;`);
                const folders = foldersResult.length > 0 && foldersResult[0].values.length > 0 
                    ? foldersResult[0].values.map(row => ({id: row[0], name: row[1]}))
                    : [];
                
                const html = `
                    <div class="form-group">
                        <label class="form-label">Select Folder</label>
                        <select class="form-input" id="moveFolderSelect" style="padding: 12px 16px;">
                            <option value="">All Folders (No specific folder)</option>
                            ${folders.map(f => `
                                <option value="${f.id}" ${currentFolderId === f.id ? 'selected' : ''}>${f.name}</option>
                            `).join('')}
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="button" class="btn" onclick="moveImageToFolder(${imageId})">Move Image</button>
                    </div>
                `;
                
                showModal('Move Image to Folder', html);
            } catch (error) {
                console.error('Error loading folders for move:', error);
                showToast('Error: ' + error.message, 'error');
            }
        }

        function moveImageToFolder(imageId) {
            if (!db) {
                showToast('Database not initialized', 'error');
                return;
            }
            
            const select = document.getElementById('moveFolderSelect');
            if (!select) return;
            
            const folderId = select.value === '' ? null : parseInt(select.value);
            
            try {
                db.run(`UPDATE images SET folder_id = ? WHERE id = ?;`, [folderId, imageId]);
                const folderName = folderId === null ? 'All Folders' : select.options[select.selectedIndex].text;
                showToast(`Image moved to "${folderName}"!`, 'success');
                if (typeof markUnsaved === 'function') markUnsaved();
                closeModal();
                loadImages();
            } catch (error) {
                console.error('Error moving image:', error);
                showToast('Error moving image: ' + error.message, 'error');
            }
        }
